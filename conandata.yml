# 依赖清单：conanfile.py 会遍历这里的 requirements 生成 Conan 图
# openssl/gtest 服务 Platform/Base/Core；sqlite3 服务 Database 的必选驱动；
# hiredis 与 libmysqlclient 分别是 Database 的 Redis / MySQL 驱动客户端
# （libmysqlclient 缺失时 MySQL 驱动会退化为报错桩，不会中断 configure）
# HTTP 报文解析是手写状态机（Net/Http/HttpParser），因此不再有 llhttp 依赖
requirements:
  - "openssl/3.6.2"
  - "gtest/1.17.0"
  - "sqlite3/3.51.3"
  - "hiredis/1.3.0"
  - "libmysqlclient/8.1.0"
