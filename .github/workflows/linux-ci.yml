# Linux CI：构建（Debug + AddressSanitizer/UBSan）并跑全量用例，含 Redis 真机集成。
#
# 与 windows-ci.yml 分工：本工作流覆盖 GCC/Linux 侧——GCC 的 ASan 会检出 MSVC 不支持的
# use-after-scope 与泄漏（测试代码的生命周期问题只有这一侧能兜住）；Redis 集成用例连真实服务。
# MySQL 依赖仍跳过（ASYN_SKIP_MYSQL_DEPS）：libmysqlclient 的 ConanCenter 预编译包在 runner
# 编译器版本变化时不保证可用，现场编译要十几分钟；MySQL 集成用例按环境变量跳过。
#
# 全量用例拆成三个分片并行跑（platform-base-core / net / database）：分片按 tests/ 下的子目录切，
# 新用例只要落在对应目录就会被自动带上，不需要维护名字清单。编译输出由 ccache 缓存——分片会让
# Platform/Base/Core 这些公共依赖被重复编译，命中缓存之后这份重复就不再花时间。
# Redis 只在 database 分片里起；版本号门禁在 release-gate.yml（那条工作流不被路径过滤跳过）。

name: Linux CI

on:
  # 只在 main 的推送与手动触发上跑：日常开发在 develop 上，PR 不再触发任何 CI（免费分钟数有限，
  # 一次全量构建+用例要几十个 runner 分钟）。要验证某个提交就手动 dispatch，或者合进 main。
  push:
    branches: [ main ]
    # 纯文档改动与工作流自身的改动不值得等构建；版本号门禁在 release-gate.yml，那条不受这里影响
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      # 一个分片红不该掩盖其它分片的结果：三个都跑完再收工
      fail-fast: false
      matrix:
        shard:
          - name: platform-base-core
            targets: "TestPlatform TestBase TestCore"
            testDirectories: "tests/Platform tests/Base tests/Core"
            redis: "0"
          - name: net
            targets: "TestNet echo_server"
            testDirectories: "tests/Net"
            redis: "0"
          - name: database
            targets: "TestDatabase"
            testDirectories: "tests/Database"
            redis: "1"

    env:
      # Conan 的包缓存搬到仓库内，便于下面的 actions/cache 缓存它
      CONAN_HOME: ${{ github.workspace }}/.conan2
      # 跳过 MySQL 客户端依赖的理由见文件头
      ASYN_SKIP_MYSQL_DEPS: "1"
      # ccache：Debug + ASan 的目标文件偏大，上限与压缩都按这个量级给
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      # 分片各存各的缓存，回退键吃到同平台其它分片留下的公共部分：Platform/Base/Core 的目标
      # 文件三个分片都要编，命中回退键就把这份重复省掉（缓存一经写入不可覆盖，因此键里带分片名）
      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.shard.name }}-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.shard.name }}-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      # ubuntu-latest 的 pip 受 PEP 668 限制不能直接装包，先建虚拟环境再进 PATH
      - name: 安装 Conan 与 ccache
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Debug + sanitizers + ccache；Conan 依赖由 conan_provider.cmake 自动安装）
        run: |
          cmake --preset debug -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # 零告警是本仓库的提交硬判据：构建失败与告警都会让这一步红
      # `-- -k 0`：一次编译完所有目标，把全部告警一次收齐——逐个文件报错时，
      # 修一轮要等一整轮 CI，收集式失败才能一轮改完
      # 只编本分片要用的目标（连同它们的依赖），三个分片并起来仍是全量
      - name: 构建（本分片的目标）
        run: cmake --build build/debug --target ${{ matrix.shard.targets }} -- -k 0

      # GitHub 的 ubuntu runner 上 vm.mmap_rnd_bits=32 时 AddressSanitizer 有随机崩溃的
      # 已知问题，调低 ASLR 熵规避；失败不阻塞（本地同为 32 且稳定，此处属保险）
      - name: 降低 ASLR 熵（稳定 AddressSanitizer）
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      # Redis 集成用例需要真实服务与口令；口令运行时随机生成并加掩码，仓库零明文口令
      - name: 启动 Redis（随机口令）
        if: matrix.shard.redis == '1'
        run: |
          REDIS_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$REDIS_PASSWORD"
          echo "REDIS_PASSWORD=$REDIS_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name ci-redis -p 6379:6379 redis:7 redis-server --requirepass "$REDIS_PASSWORD"
          for attempt in $(seq 1 30); do
            if docker exec ci-redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "Redis 未在 30 秒内就绪，容器日志：" >&2
          docker logs ci-redis >&2
          exit 1

      # 按 tests/ 下的子目录跑 ctest：每个分片只跑自己那一批，用例清单由 gtest_discover_tests
      # 在构建期生成，新增用例落在对应目录里就会自动进来
      - name: 用例（本分片）
        run: |
          if [ "${{ matrix.shard.redis }}" = "1" ]; then
            export ASYN_REDIS_TEST_HOST=127.0.0.1
            export ASYN_REDIS_TEST_PASSWORD="$REDIS_PASSWORD"
          fi
          for testDirectory in ${{ matrix.shard.testDirectories }}; do
            ctest --test-dir "build/debug/$testDirectory" --output-on-failure -j"$(nproc)"
          done

      - name: 失败时上传用例日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-linux-${{ matrix.shard.name }}
          path: build/debug/tests/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # 跨实现一致性验收（HTTP/2 与 WebSocket）：拿独立实现当对端，把「两边都按 RFC 办事」变成每次
  # 合入都跑的判据，而不是一次性手工结论。自写客户端只会重复本框架自己对协议的理解，两边一起错的
  # 地方查不出来——h2c 那条探针就是这样查出一条取消会带走整条连接的问题。
  #
  # 跑的是 scripts/ 下那几条与手动完全相同的脚本（挂上 CI 只为不让它们烂掉）：
  # h2_adversarial_probe.sh（curl 自带 nghttp2）、ws_interop_probe.py（websockets）、
  # websocket_autobahn.sh（Autobahn|Testsuite 的 517 条用例，官方镜像）。
  # h3 那侧已有 http3-acceptance 作业跑 aioquic，这里不重复；Windows 侧不建这个作业：
  # 本机 mingw 的 curl 编译时没带 HTTP/2，--http2-prior-knowledge 直接报「不支持」，
  # 等于跑给空气看。
  #
  # 三台服务端的分工写在下面那一步里（--h2c 会把同一端口的明文连接全部收走，不再服务 h1）。
  #
  # 计时余量给的是 Autobahn：517 条用例里有 4 MiB / 8 MiB 的大消息往返与 permessage-deflate 的
  # 各形分片，而这里跑的是 Debug + ASan 那台服务端（release 侧本机实测整轮约 13 分钟）。
  protocol-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-conformance-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-conformance-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      # websockets 与 Conan 同放一个 venv：ubuntu-latest 的系统 pip 受 PEP 668 限制不能直接装包
      - name: 安装 Conan 与独立 WebSocket 实现
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25" websockets
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Debug + sanitizers + ccache）
        run: |
          cmake --preset debug -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # 探针只需要「一个能跑的服务端」，示例服务器就是它：h2c / TLS 的开关都齐
      - name: 构建 echo_server
        run: cmake --build build/debug --target echo_server -- -k 0

      # h2spec 是**别人写的** HTTP/2 裁判：146 条判据直接引 RFC 的句子，自家探针查不出的
      # 「两边都错在同一种理解上」由它查。取固定版本的官方发布包（不自己编 Go），失败就让它红——
      # 拿不到裁判与裁判判不过，都需要被人看见
      - name: 取 h2spec（跨实现一致性裁判）
        run: |
          set -euo pipefail
          h2spec_version=v2.6.0
          curl -sSfL -o /tmp/h2spec.tgz \
            "https://github.com/summerwind/h2spec/releases/download/${h2spec_version}/h2spec_linux_amd64.tar.gz"
          tar -xzf /tmp/h2spec.tgz -C /tmp
          /tmp/h2spec --version

      - name: 降低 ASLR 熵（稳定 AddressSanitizer）
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: 起服务端并跑跨实现探针
        run: |
          # 最后一个参数是 URL，其余全转给 curl；等到真能应答才开测——ASan 下的启动比平时慢，
          # 不等就绪就会拿到「000」这种与协议无关的红
          wait_ready() {
            local url="${*:$#}"
            local extra=("${@:1:$#-1}")
            for _ in $(seq 1 60); do
              if curl -s -o /dev/null --max-time 2 "${extra[@]}" "$url"; then return 0; fi
              sleep 0.5
            done
            echo "服务端没在 30 秒内应答：$url" >&2
            return 1
          }

          # 18080：h2c + /metrics（那条探针要读计数）。--h2c 会把明文连接一律收进 HTTP/2，
          # 同一端口不再服务 HTTP/1.1，所以下面的 WebSocket 探针必须另开一台明文 h1 的服务端
          build/debug/samples/echo_server --port 18080 --threads 2 --metrics --h2c > /tmp/h2c.log 2>&1 &
          h2c_pid=$!
          build/debug/samples/echo_server --port 18081 --threads 2 --metrics > /tmp/plain.log 2>&1 &
          plain_pid=$!
          # 18443：TLS。wss 走 TCP+ALPN，对端只报 http/1.1 时就按 h1 服务（这正是它要协商到的形态）
          build/debug/samples/echo_server --port 18443 --threads 1 --https \
            --cert tests/Core/fixtures/test_cert.pem --key tests/Core/fixtures/test_key.pem \
            > /tmp/tls.log 2>&1 &
          tls_pid=$!

          # 都要跑完再收：任一失败就让作业红，并把服务端日志留成产物
          status=0
          wait_ready --http2-prior-knowledge "http://127.0.0.1:18080/json" \
            && bash scripts/h2_adversarial_probe.sh 18080 || status=1
          # 同一台 h2c 服务端再过一次外部裁判；--strict 把那几条「实现可选」的也一并判了
          wait_ready --http2-prior-knowledge "http://127.0.0.1:18080/json" \
            && /tmp/h2spec -h 127.0.0.1 -p 18080 --strict || status=1
          # TLS 侧走 ALPN 挑出 h2：与明文那条判的是同一套规则，但走的是另一条协商路径
          wait_ready -k "https://127.0.0.1:18443/json" \
            && /tmp/h2spec -h 127.0.0.1 -p 18443 --tls --insecure || status=1
          wait_ready "http://127.0.0.1:18081/json" \
            && python scripts/ws_interop_probe.py 127.0.0.1 18081 || status=1
          # Autobahn|Testsuite：另一家独立实现的 517 条用例，判的是「期望的事件序列」。
          # 本机这一轮由它查出「回显不分类型一律发文本帧」与「单帧上限比消息上限还小」两处。
          # 默认排掉超本端 8 MiB 消息上限的那两条（按 §7.1.6 回 1009 属规范许可的拒绝），见脚本头
          wait_ready "http://127.0.0.1:18081/json" \
            && bash scripts/websocket_autobahn.sh 18081 || status=1
          wait_ready -k "https://127.0.0.1:18443/json" \
            && python scripts/ws_interop_probe.py 127.0.0.1 18443 --wss || status=1

          kill "$h2c_pid" "$plain_pid" "$tls_pid" 2>/dev/null
          wait "$h2c_pid" "$plain_pid" "$tls_pid" 2>/dev/null
          exit "$status"

      - name: 失败时上传服务端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-server-logs
          path: /tmp/*.log
          if-no-files-found: ignore

  # MySQL 真机驱动分支的**编译**覆盖：其余作业一律 ASYN_SKIP_MYSQL_DEPS=1 +
  # -DDATABASE_WITH_MYSQL=OFF，于是 MySqlConnection/MySqlResult 那些源文件在 CI 里从不参与编译，
  # 连语法/类型错误都不会红（本机真机用例跑的是另一套环境）。这个作业只构建 Database 目标，
  # 不做真机连接测试。
  #
  # 成本：libmysqlclient 在 ConanCenter 上只有源码包，第一次跑要现场编译十几分钟；之后
  # CONAN_HOME 被 actions/cache 缓存（key 与其它作业相同），后续运行几乎是白拿。
  mysql-driver-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      # 这个作业存在的意义就是要它——不设 ASYN_SKIP_MYSQL_DEPS

    steps:
      - uses: actions/checkout@v4

      # 缓存键必须与其它作业不同：共用键会让「先命中的那个作业」把缓存内容钉死。
      # 其它作业的依赖集里没有 libmysqlclient，若共用键，命中它们的缓存后本作业
      # 仍要回退去现场编译 MySQL 驱动（或反过来把他的缓存顶掉），缓存等于白设。
      # 注意 GitHub Actions 的缓存一经写入不可覆盖，所以两类依赖集必须各占一个键。
      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-mysql-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（只编库本体，开 MySQL 真机分支）
        run: |
          cmake -S . -B build/mysql-driver-check -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDATABASE_WITH_MYSQL=ON \
            -DASYN_BUILD_TESTS=OFF \
            -DASYN_BUILD_SAMPLES=OFF \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/conan_provider.cmake"

      - name: 编译 Database（含真机驱动分支；告警同样是失败）
        run: cmake --build build/mysql-driver-check --target Database -- -k 0

  # io_uring 事件后端：编译**并且真的跑一遍用例**。该分支只在显式开关下参与编译（默认走 epoll），
  # 而三后端共用一套契约、多数断言在 epoll 后端下恒绿——只在一台后端上跑等于没测（io_uring 不校验
  # 描述符、改掩码时机与 epoll 不同，这两处真实偏离就是这么找到的）。内核不放行 io_uring 时跳过运行
  # 而不是让全仓 PR 变红：这一步要抓的是后端契约回归，不是 runner 的内核策略。
  #
  # mimalloc 分支不在其中：它要先在 conanfile 里声明依赖（find_package(mimalloc REQUIRED)），
  # 而本仓库的 Conan 依赖清单里没有它——加作业之前得先补依赖，见 PR 说明。
  io-uring-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（io_uring 事件后端；带上用例，否则等于只编了一遍）
        run: |
          cmake -S . -B build/io-uring-check -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DASYN_WITH_IO_URING=ON \
            -DDATABASE_WITH_MYSQL=OFF \
            -DASYN_BUILD_TESTS=ON \
            -DASYN_BUILD_SAMPLES=OFF \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/conan_provider.cmake"

      - name: 编译 Core 与 Core 用例（io_uring 分支；告警同样是失败）
        run: cmake --build build/io-uring-check --target TestCore -- -k 0

      - name: 探测本 runner 是否放行 io_uring
        id: uring-usable
        run: |
          disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 0)
          if [ "$disabled" != "0" ]; then
            echo "isUsable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::内核已禁用 io_uring（io_uring_disabled=$disabled），本作业退化为只编译"
          else
            echo "isUsable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 跑事件循环与后端契约用例（io_uring 后端）
        if: steps.uring-usable.outputs.isUsable == 'true'
        run: |
          ctest --test-dir build/io-uring-check \
            -R "Epoll|IoWatcher|Timer|TimerQueue|EventLoop|Scheduler|ThreadPool|IoContext|Uring" \
            -j 4 --output-on-failure

  # 线程竞态检测：TSan 与 ASan 互斥（不能同时插桩），因此另起一个构建目录，只跑**并发相关**的
  # 用例集，把 CI 时间压在可接受范围（本机 Linux 上可以直接跑全量）。事件循环、线程池与跨循环
  # 投递（scheduleRemote / 全局队列 / TimerQueue 唤醒）此前只有注释级约定，这里是唯一的自动兜底。
  thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      # 与 build-and-test 同源的 ccache：同样的源码、不同的插桩选项，ccache 按参数分开存，
      # 互不干扰
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-tsan-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-tsan-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: 安装 Conan 与 ccache
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      # 复用 debug 预设（含 -g 与 Ninja），但把目录换成 build/tsan，并关掉 ASan、只留 TSan
      - name: 配置（Debug + ThreadSanitizer + ccache）
        run: |
          cmake --preset debug -B build/tsan -DSANITIZE_THREADS=ON -DENABLE_SANITIZERS=OFF -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: 构建
        run: cmake --build build/tsan

      - name: 降低 ASLR 熵（稳定 Sanitizer）
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: 并发相关用例集（TSan）
        # WorkerSupervisor 在列：它是 Core 里唯一「另一个线程可以来读」的进程编排——观察线程
        # 与编排线程碰同一批 worker 句柄。这类竞态只有 TSan 看得见，MSVC 侧根本不编这个用例
        run: ctest --test-dir build/tsan --output-on-failure -j"$(nproc)" -R "Scheduler|Thread|Timer|EventLoop|IoWatcher|TcpServer|TcpAcceptor|TcpStream|Connection|HttpSession|HttpStreaming|Http2|WebSocket|FileWatcher|EventNotifier|AsyncSink|ConnectionPool|AsyncExecutor|Logger|Config|WorkerSupervisor"

      - name: 失败时上传用例日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-tsan
          path: build/tsan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # 静态检查：仓库里一直有 .clang-tidy（bugprone-* 等一组精选检查），但没有任何流水线跑它——
  # 等于一份没人执行的规范。这里补上。
  #
  # 当前以**报告形式**接入：存量的告警数量还没有清点过，直接把 --warnings-as-errors 打开会让
  # 每次推送都红。CI 日志里能看到全部发现；把下面的 -warnings-as-errors 改成 '*'（或先清干净
  # 存量再打开）它就成为门禁。clang-tidy 只扫本仓库源码（src/，不含 third_party/）。
  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan、clang-tidy 与 run-clang-tidy
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          echo "CLANG_TIDY_BIN=$(command -v clang-tidy)" >> "$GITHUB_ENV"

      - name: 探测 Conan profile
        run: conan profile detect --force

      # 生成 compile_commands.json（clang-tidy 需要它来取每个文件的真实编译参数）
      - name: 配置（生成编译数据库）
        run: cmake --preset debug -DDATABASE_WITH_MYSQL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # -p build/debug：从编译数据库取参数；--header-filter 只看本仓库头文件；
      # run-clang-tidy 会并行处理 src/ 下的全部翻译单元
      - name: 运行 clang-tidy（报告形式，不阻塞）
        run: |
          run-clang-tidy -p build/debug -header-filter '.*[\\/]src[\\/].*' -quiet src/ 2>&1 | tee /tmp/clang-tidy.log
          {
            echo "## clang-tidy 摘要（报告形式，当前不阻塞）"
            echo '```'
            grep -cE "warning:|error:" /tmp/clang-tidy.log || echo 0
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 clang-tidy 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: /tmp/clang-tidy.log
          if-no-files-found: ignore

  # HTTP/3 互通验收：用 aioquic（独立实现）当对端，按场景打 echo_server 的 h3 端点——GET 的响应头
  # 逐条核、HEAD 不许带正文、流式响应要分趟、大正文按序拼回、声明 gzip 就得真压上、扩展 CONNECT
  # （RFC 9220）隧道要回显。h3 会话用例的对端是测试自己按 RFC 排字节的（第三方实现已移出构建），
  # 它对「字节合不合规范」只算自证，这份判定必须由不认识本仓代码的实现来出。
  # 用 Release 构建：验收量的是协议能否互通，插桩只会拖慢握手。
  http3-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan 与 aioquic
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25" aioquic
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Release；Conan 依赖由 conan_provider.cmake 自动安装）
        run: cmake --preset release -DDATABASE_WITH_MYSQL=OFF

      - name: 构建 echo_server 与 QUIC 跨实现探针的被测端
        run: |
          cmake --build build/release --target echo_server quic_probe_server quic_probe_client

      - name: HTTP/3 跨实现验收（GET/HEAD/流式/大正文/压缩/WebSocket 隧道）
        run: ASYN_H3_CROSS_LOG=/tmp/echo-h3.log bash scripts/h3_cross_check.sh build/release "$(command -v python3)"

      # QUIC 服务端的对外行为此前由链接进来的 ngtcp2 裁定，那条裁判已拆掉：换成进程外的 aioquic，
      # 判据由独立实现的解析器给出（同树互测暴露不出共享的误解，还会跟着被测代码一起被改松）。
      - name: QUIC 跨实现验收（握手、ALPN、流收尾、drain、限额、恢复）
        run: bash scripts/quic_cross_check.sh build/release "$(command -v python3)"

      # 出站方向同一套道理，方向相反：对端换成 aioquic 起的服务端。这一条不是重复覆盖——
      # 「客户端要把回包目的标识换成服务端自报的那个」（RFC 9000 §7.2）在自家两型互测里测不出来
      # （自家服务端同时认得客户端自造的标识），只有独立实现会因为打错标识而不应答。
      - name: QUIC 出站跨实现验收（握手、ALPN、双向流的回显）
        run: bash scripts/quic_outbound_cross_check.sh build/release "$(command -v python3)"

      - name: 失败时上传服务端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: echo-h3-log
          path: /tmp/echo-h3.log
          if-no-files-found: ignore

  # 协议解码器的持续模糊：四类解码器（WebSocket 帧、h2 帧与 HPACK、h3 帧、QUIC 变长整数）连同它们的
  # 依赖闭包自成一组翻译单元，不需要 Conan、不需要配置构建——脚本自己用 clang 的 libFuzzer 编一份独立
  # 产物。此前这一步只有本机手工跑（`scripts/fuzz-net.sh` 当初是为 Windows 侧写的，一轮 60 秒），
  # 回归时没有任何流水线会替我们喂随机字节，而这类解码器的历史缺陷全是越界与释放后读。
  # 违例样本落进 .fuzz/artifacts/，失败时作为工件取出，原样搬进 tests/Net/Fuzz/TestProtocolFuzz.cpp
  # 的种子用例即可常驻。
  protocol-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # runner 镜像自带带 compiler-rt fuzzer 运行时的 clang：这里不再 apt 装东西，
      # 免得这条作业的红来自装包失败而不是解码器有问题
      - name: 模糊四类协议解码器（300 秒）
        run: bash scripts/fuzz-net.sh 300 -error_exitcode=1 -workers=2 -jobs=2

      - name: 失败时取出崩溃样本
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: .fuzz/artifacts/
          if-no-files-found: ignore

  # 行覆盖率：此前「覆盖率只能手工量」（本机全量含真库用例 76.2% 行覆盖），CI 里没有任何数字，
  # 也没有门禁。这里补上：跑一遍全量用例收 .gcda，用 gcovr 汇总，按行覆盖率下限把关。
  # 阈值故意取在实测下游——本作业不带 MySQL/Redis 真库分支，天然比手工基线低一截；首日就红的
  # 门禁只会教会人忽略红。要提阈值，请实测之后连同 COVERAGE_LINE_FLOOR 一起改，两处必须同解。
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      COVERAGE_LINE_FLOOR: "60"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan 与 gcovr
        run: |
          python3 -m venv "$HOME/cov-venv"
          "$HOME/cov-venv/bin/pip" install "conan>=2.25" gcovr
          echo "$HOME/cov-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（--coverage 插桩；关掉 sanitizer——两种插桩互相干扰，且门禁另有作业）
        run: |
          cmake -S . -B build/coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=OFF \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DDATABASE_WITH_MYSQL=OFF \
            -DASYN_BUILD_SAMPLES=OFF \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/conan_provider.cmake"

      - name: 编译全部用例（-k 0 收集式失败，一次看全所有编译错误）
        run: cmake --build build/coverage -- -k 0

      - name: 跑用例生成 .gcda
        run: ctest --test-dir build/coverage -j 4

      - name: 汇总行覆盖率并按下限把关
        run: |
          # 阈值判断交给 gcovr 自己（--fail-under-line 直接决定退出码）：自己 grep + 截取
          # 百分比字符串会随输出格式漂移，宁可让工具负责
          gcovr --root "$PWD" --filter 'src/' --exclude-unreachable-branches \
            --fail-under-line "$COVERAGE_LINE_FLOOR" --txt | tee /tmp/gcovr.txt
