# Linux CI：构建（Debug + AddressSanitizer/UBSan）并跑全量用例，含 Redis 真机集成。
#
# 与 windows-ci.yml 分工：本工作流覆盖 GCC/Linux 侧——GCC 的 ASan 会检出 MSVC 不支持的
# use-after-scope 与泄漏（测试代码的生命周期问题只有这一侧能兜住）；Redis 集成用例连真实服务。
# MySQL 依赖仍跳过（ASYN_SKIP_MYSQL_DEPS）：libmysqlclient 的 ConanCenter 预编译包在 runner
# 编译器版本变化时不保证可用，现场编译要十几分钟；MySQL 集成用例按环境变量跳过。
#
# 全量用例拆成三个分片并行跑（platform-base-core / net / database）：分片按 tests/ 下的子目录切，
# 新用例只要落在对应目录就会被自动带上，不需要维护名字清单。编译输出由 ccache 缓存——分片会让
# Platform/Base/Core 这些公共依赖被重复编译，命中缓存之后这份重复就不再花时间。
# Redis 只在 database 分片里起；版本号门禁在 release-gate.yml（那条工作流不被路径过滤跳过）。

name: Linux 门禁

on:
  # 只在 main 的推送与手动触发上跑：日常开发在 develop 上，PR 不再触发任何 CI（免费分钟数有限，
  # 一次全量构建+用例要几十个 runner 分钟）。要验证某个提交就手动 dispatch，或者合进 main。
  push:
    branches: [ main ]
    # 纯文档改动与工作流自身的改动不值得等构建；版本号门禁在 release-gate.yml，那条不受这里影响
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: 构建与全量用例 · ${{ matrix.shard.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      # 一个分片红不该掩盖其它分片的结果：三个都跑完再收工
      fail-fast: false
      matrix:
        shard:
          - name: platform-base-core
            label: Platform / Base / Core
            targets: "TestPlatform TestBase TestCore"
            testDirectories: "tests/Platform tests/Base tests/Core"
            redis: "0"
          - name: net
            label: Net
            targets: "TestNet ReferenceServer"
            testDirectories: "tests/Net"
            redis: "0"
          - name: database
            label: Database
            targets: "TestDatabase"
            testDirectories: "tests/Database"
            redis: "1"

    env:
      # Conan 的包缓存搬到仓库内，便于下面的 actions/cache 缓存它
      CONAN_HOME: ${{ github.workspace }}/.conan2
      # 跳过 MySQL 客户端依赖的理由见文件头
      ASYN_SKIP_MYSQL_DEPS: "1"
      # ccache：Debug + ASan 的目标文件偏大，上限与压缩都按这个量级给
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      # 分片各存各的缓存，回退键吃到同平台其它分片留下的公共部分：Platform/Base/Core 的目标
      # 文件三个分片都要编，命中回退键就把这份重复省掉（缓存一经写入不可覆盖，因此键里带分片名）
      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.shard.name }}-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.shard.name }}-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      # ubuntu-latest 的 pip 受 PEP 668 限制不能直接装包，先建虚拟环境再进 PATH
      - name: 安装 Conan 与 ccache
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Debug + sanitizers + ccache；Conan 依赖由 conan_provider.cmake 自动安装）
        run: |
          cmake --preset debug -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # 零告警是本仓库的提交硬判据：构建失败与告警都会让这一步红
      # `-- -k 0`：一次编译完所有目标，把全部告警一次收齐——逐个文件报错时，
      # 修一轮要等一整轮 CI，收集式失败才能一轮改完
      # 只编本分片要用的目标（连同它们的依赖），三个分片并起来仍是全量
      - name: 构建（本分片的目标）
        run: cmake --build build/debug --target ${{ matrix.shard.targets }} -- -k 0

      # GitHub 的 ubuntu runner 上 vm.mmap_rnd_bits=32 时 AddressSanitizer 有随机崩溃的
      # 已知问题，调低 ASLR 熵规避；失败不阻塞（本地同为 32 且稳定，此处属保险）
      - name: 降低 ASLR 熵（稳定 AddressSanitizer）
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      # Redis 集成用例需要真实服务与口令；口令运行时随机生成并加掩码，仓库零明文口令
      - name: 启动 Redis（随机口令）
        if: matrix.shard.redis == '1'
        run: |
          REDIS_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$REDIS_PASSWORD"
          echo "REDIS_PASSWORD=$REDIS_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name ci-redis -p 6379:6379 redis:7 redis-server --requirepass "$REDIS_PASSWORD"
          for attempt in $(seq 1 30); do
            if docker exec ci-redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "Redis 未在 30 秒内就绪，容器日志：" >&2
          docker logs ci-redis >&2
          exit 1

      # 按 tests/ 下的子目录跑 ctest：每个分片只跑自己那一批，用例清单由 gtest_discover_tests
      # 在构建期生成，新增用例落在对应目录里就会自动进来
      - name: 用例（本分片）
        run: |
          if [ "${{ matrix.shard.redis }}" = "1" ]; then
            export ASYN_REDIS_TEST_HOST=127.0.0.1
            export ASYN_REDIS_TEST_PASSWORD="$REDIS_PASSWORD"
          fi
          for testDirectory in ${{ matrix.shard.testDirectories }}; do
            ctest --test-dir "build/debug/$testDirectory" --output-on-failure -j"$(nproc)"
          done

      - name: 失败时上传用例日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-linux-${{ matrix.shard.name }}
          path: build/debug/tests/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # 跨实现一致性验收（HTTP/2 与 WebSocket）：拿独立实现当对端，把「两边都按 RFC 办事」变成每次
  # 合入都跑的判据，而不是一次性手工结论。自写客户端只会重复本框架自己对协议的理解，两边一起错的
  # 地方查不出来——h2c 那条探针就是这样查出一条取消会带走整条连接的问题。
  #
  # 跑的是 scripts/ 下那几条与手动完全相同的脚本（挂上 CI 只为不让它们烂掉）：
  # h2_adversarial_probe.sh（curl 自带 nghttp2）、ws_interop_probe.py（websockets）、
  # websocket_autobahn.sh（Autobahn|Testsuite 的 517 条用例，官方镜像）。
  # h3 那侧已有 http3-acceptance 作业跑 aioquic，这里不重复；Windows 侧不建这个作业：
  # 本机 mingw 的 curl 编译时没带 HTTP/2，--http2-prior-knowledge 直接报「不支持」，
  # 等于跑给空气看。
  #
  # 三台服务端的分工写在下面那一步里（--h2c 会把同一端口的明文连接全部收走，不再服务 h1）。
  #
  # 计时余量给的是 Autobahn：517 条用例里有 4 MiB / 8 MiB 的大消息往返与 permessage-deflate 的
  # 各形分片，而这里跑的是 Debug + ASan 那台服务端（release 侧本机实测整轮约 13 分钟）。
  protocol-conformance:
    name: 规范裁判：h2spec 与 Autobahn
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-conformance-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-conformance-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      # websockets 与 Conan 同放一个 venv：ubuntu-latest 的系统 pip 受 PEP 668 限制不能直接装包。
      # ccache 必须在这里装上：下面配置传了 COMPILER_LAUNCHER=ccache，CMake 不校验它存不存在，
      # 缺了就变成每条编译命令 /bin/sh: ccache: not found（构建以 127 退出，整条裁判链跑不起来）
      - name: 安装 Conan、ccache 与独立 WebSocket 实现
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25" websockets
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Debug + sanitizers + ccache）
        run: |
          cmake --preset debug -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # 探针只需要「一个能跑的服务端」，示例服务器就是它：h2c / TLS 的开关都齐
      - name: 构建 ReferenceServer
        run: cmake --build build/debug --target ReferenceServer -- -k 0

      # h2spec 是**别人写的** HTTP/2 裁判：146 条判据直接引 RFC 的句子，自家探针查不出的
      # 「两边都错在同一种理解上」由它查。取固定版本的官方发布包（不自己编 Go），失败就让它红——
      # 拿不到裁判与裁判判不过，都需要被人看见
      - name: 取 h2spec（跨实现一致性裁判）
        run: |
          set -euo pipefail
          h2spec_version=v2.6.0
          curl -sSfL -o /tmp/h2spec.tgz \
            "https://github.com/summerwind/h2spec/releases/download/${h2spec_version}/h2spec_linux_amd64.tar.gz"
          tar -xzf /tmp/h2spec.tgz -C /tmp
          /tmp/h2spec --version

      - name: 降低 ASLR 熵（稳定 AddressSanitizer）
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: 起服务端并跑跨实现探针
        run: |
          # 最后一个参数是 URL，其余全转给 curl；等到真能应答才开测——ASan 下的启动比平时慢，
          # 不等就绪就会拿到「000」这种与协议无关的红
          wait_ready() {
            local url="${*:$#}"
            local extra=("${@:1:$#-1}")
            for _ in $(seq 1 60); do
              if curl -s -o /dev/null --max-time 2 "${extra[@]}" "$url"; then return 0; fi
              sleep 0.5
            done
            echo "服务端没在 30 秒内应答：$url" >&2
            return 1
          }

          # 18080：h2c + /metrics（那条探针要读计数）。--h2c 会把明文连接一律收进 HTTP/2，
          # 同一端口不再服务 HTTP/1.1，所以下面的 WebSocket 探针必须另开一台明文 h1 的服务端
          build/debug/samples/ReferenceServer --port 18080 --threads 2 --metrics --h2c > /tmp/h2c.log 2>&1 &
          h2c_pid=$!
          # 18081 这台要能被容器访问到：Autobahn 跑在另一个网络命名空间里，经 host-gateway 回到宿主，
          # 而 ReferenceServer 默认只听 localhost（Docker Desktop 的代理能进宿主回环，Linux 不能 →
          # 表现就是 wstest 起来了却「Connection refused」，一条用例都跑不完）
          build/debug/samples/ReferenceServer --host 0.0.0.0 --port 18081 --threads 2 --metrics > /tmp/plain.log 2>&1 &
          plain_pid=$!
          # 18443：TLS。wss 走 TCP+ALPN，对端只报 http/1.1 时就按 h1 服务（这正是它要协商到的形态）
          build/debug/samples/ReferenceServer --port 18443 --threads 1 --https \
            --cert tests/Core/fixtures/test_cert.pem --key tests/Core/fixtures/test_key.pem \
            > /tmp/tls.log 2>&1 &
          tls_pid=$!

          # 都要跑完再收：任一失败就让作业红，并把服务端日志留成产物
          status=0
          wait_ready --http2-prior-knowledge "http://127.0.0.1:18080/json" \
            && bash scripts/h2_adversarial_probe.sh 18080 || status=1
          # 同一台 h2c 服务端再过一次外部裁判；--strict 把那几条「实现可选」的也一并判了
          wait_ready --http2-prior-knowledge "http://127.0.0.1:18080/json" \
            && /tmp/h2spec -h 127.0.0.1 -p 18080 --strict || status=1
          # TLS 侧走 ALPN 挑出 h2：与明文那条判的是同一套规则，但走的是另一条协商路径
          wait_ready -k "https://127.0.0.1:18443/json" \
            && /tmp/h2spec -h 127.0.0.1 -p 18443 --tls --insecure || status=1
          wait_ready "http://127.0.0.1:18081/json" \
            && python scripts/ws_interop_probe.py 127.0.0.1 18081 || status=1
          # Autobahn|Testsuite：另一家独立实现的 517 条用例，判的是「期望的事件序列」。
          # 本机这一轮由它查出「回显不分类型一律发文本帧」与「单帧上限比消息上限还小」两处。
          # 默认排掉超本端 8 MiB 消息上限的那两条（按 §7.1.6 回 1009 属规范许可的拒绝），见脚本头
          wait_ready "http://127.0.0.1:18081/json" \
            && bash scripts/websocket_autobahn.sh 18081 || status=1
          wait_ready -k "https://127.0.0.1:18443/json" \
            && python scripts/ws_interop_probe.py 127.0.0.1 18443 --wss || status=1

          kill "$h2c_pid" "$plain_pid" "$tls_pid" 2>/dev/null
          wait "$h2c_pid" "$plain_pid" "$tls_pid" 2>/dev/null
          exit "$status"

      - name: 失败时上传服务端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-server-logs
          path: /tmp/*.log
          if-no-files-found: ignore

  # MySQL 真机驱动分支的**编译**覆盖：其余作业一律 ASYN_SKIP_MYSQL_DEPS=1 +
  # -DDATABASE_WITH_MYSQL=OFF，于是 MySqlConnection/MySqlResult 那些源文件在 CI 里从不参与编译，
  # 连语法/类型错误都不会红（本机真机用例跑的是另一套环境）。这个作业只构建 Database 目标，
  # 不做真机连接测试。
  #
  # 成本：libmysqlclient 在 ConanCenter 上只有源码包，第一次跑要现场编译十几分钟；之后
  # CONAN_HOME 被 actions/cache 缓存（key 与其它作业相同），后续运行几乎是白拿。
  mysql-driver-compile:
    name: MySQL 驱动的编译档
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      # 这个作业存在的意义就是要它——不设 ASYN_SKIP_MYSQL_DEPS

    steps:
      - uses: actions/checkout@v4

      # 缓存键必须与其它作业不同：共用键会让「先命中的那个作业」把缓存内容钉死。
      # 其它作业的依赖集里没有 libmysqlclient，若共用键，命中它们的缓存后本作业
      # 仍要回退去现场编译 MySQL 驱动（或反过来把他的缓存顶掉），缓存等于白设。
      # 注意 GitHub Actions 的缓存一经写入不可覆盖，所以两类依赖集必须各占一个键。
      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-mysql-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（只编库本体，开 MySQL 真机分支）
        run: |
          cmake -S . -B build/mysql-driver-check -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDATABASE_WITH_MYSQL=ON \
            -DASYN_BUILD_TESTS=OFF \
            -DASYN_BUILD_SAMPLES=OFF \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/conan_provider.cmake"

      - name: 编译 Database（含真机驱动分支；告警同样是失败）
        run: cmake --build build/mysql-driver-check --target Database -- -k 0

  # io_uring 事件后端：编译**并且真的跑一遍用例**。该分支只在显式开关下参与编译（默认走 epoll），
  # 而三后端共用一套契约、多数断言在 epoll 后端下恒绿——只在一台后端上跑等于没测（io_uring 不校验
  # 描述符、改掩码时机与 epoll 不同，这两处真实偏离就是这么找到的）。内核不放行 io_uring 时跳过运行
  # 而不是让全仓 PR 变红：这一步要抓的是后端契约回归，不是 runner 的内核策略。
  #
  # mimalloc 分支不在其中：它要先在 conanfile 里声明依赖（find_package(mimalloc REQUIRED)），
  # 而本仓库的 Conan 依赖清单里没有它——加作业之前得先补依赖，见 PR 说明。
  io-uring-compile:
    name: io_uring 的编译档
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（io_uring 事件后端；带上用例，否则等于只编了一遍）
        run: |
          cmake -S . -B build/io-uring-check -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DASYN_WITH_IO_URING=ON \
            -DDATABASE_WITH_MYSQL=OFF \
            -DASYN_BUILD_TESTS=ON \
            -DASYN_BUILD_SAMPLES=OFF \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/conan_provider.cmake"

      - name: 编译 Core 与 Core 用例（io_uring 分支；告警同样是失败）
        run: cmake --build build/io-uring-check --target TestCore -- -k 0

      - name: 探测本 runner 是否放行 io_uring
        id: uring-usable
        run: |
          disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 0)
          if [ "$disabled" != "0" ]; then
            echo "isUsable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::内核已禁用 io_uring（io_uring_disabled=$disabled），本作业退化为只编译"
          else
            echo "isUsable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 跑事件循环与后端契约用例（io_uring 后端）
        if: steps.uring-usable.outputs.isUsable == 'true'
        run: |
          ctest --test-dir build/io-uring-check \
            -R "Epoll|IoWatcher|Timer|TimerQueue|EventLoop|Scheduler|ThreadPool|IoContext|Uring" \
            -j 4 --output-on-failure

  # 线程竞态检测：TSan 与 ASan 互斥（不能同时插桩），因此另起一个构建目录，只跑**并发相关**的
  # 用例集，把 CI 时间压在可接受范围（本机 Linux 上可以直接跑全量）。事件循环、线程池与跨循环
  # 投递（scheduleRemote / 全局队列 / TimerQueue 唤醒）此前只有注释级约定，这里是唯一的自动兜底。
  thread-sanitizer:
    name: ThreadSanitizer：线程契约
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      # 与 build-and-test 同源的 ccache：同样的源码、不同的插桩选项，ccache 按参数分开存，
      # 互不干扰
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
      # 筛面只在这一处定义：数命中的条数与真正跑它用的是同一个串，两处不会各说一套
      TSAN_TEST_FILTER: "Scheduler|Thread|Timer|EventLoop|IoWatcher|TcpServer|TcpAcceptor|TcpStream|Connection|HttpSession|HttpStreaming|Http2|WebSocket|FileWatcher|EventNotifier|AsyncSink|ConnectionPool|AsyncExecutor|Logger|Config|WorkerSupervisor"
      # 筛面下限：2026-10-01 实测命中 1325 / 全量 3669，往下留一档。
      # 掉到这条线以下有两种真相：类名改了，或新增的跨线程面根本不在这 21 个词里——
      # 两者的外观都与「TSan 全绿」同形，所以判据必须钉在条数上而不是只跑一次
      TSAN_MIN_MATCHED: "1200"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-tsan-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-tsan-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: 安装 Conan 与 ccache
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      # 复用 debug 预设（含 -g 与 Ninja），但把目录换成 build/tsan，并关掉 ASan、只留 TSan
      - name: 配置（Debug + ThreadSanitizer + ccache）
        run: |
          cmake --preset debug -B build/tsan -DSANITIZE_THREADS=ON -DENABLE_SANITIZERS=OFF -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: 构建
        run: cmake --build build/tsan

      - name: 降低 ASLR 熵（稳定 Sanitizer）
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: 并发相关用例集（TSan，先报筛面再跑）
        # WorkerSupervisor 在列：它是 Core 里唯一「另一个线程可以来读」的进程编排——观察线程
        # 与编排线程碰同一批 worker 句柄。这类竞态只有 TSan 看得见，MSVC 侧根本不编这个用例
        run: |
          # 先数「这条正则实际筛到多少条」：TSan 是按类名筛的，一个新增的跨线程面只要名字里
          # 不含那 21 个词就一条都不跑，而作业照样全绿。把条数打进摘要并钉下限，才有东西可红。
          # 条数取 ctest 自己那行 Total Tests：按 grep -c "Test #" 数会漏掉编号不足四位的那些
          # （ctest 给 #1..#999 打两个空格、#1000 起打一个空格），本机实测两种数法差 999 条
          totalCount="$(ctest --test-dir build/tsan -N | sed -n 's/^Total Tests: //p')"
          matchedCount="$(ctest --test-dir build/tsan -N -R "${TSAN_TEST_FILTER}" | sed -n 's/^Total Tests: //p')"
          echo "TSan 筛面：命中 ${matchedCount} / 全量 ${totalCount} 条（下限 ${TSAN_MIN_MATCHED}）"
          echo "### TSan 的覆盖面" >> "$GITHUB_STEP_SUMMARY"
          echo "命中 ${matchedCount} / 全量 ${totalCount} 条，下限 ${TSAN_MIN_MATCHED}（其余用例不在 TSan 档跑）" >> "$GITHUB_STEP_SUMMARY"
          if [ "${matchedCount}" -lt "${TSAN_MIN_MATCHED}" ]; then
            echo "筛面只剩 ${matchedCount} 条：要么类名改了，要么这份构建根本没生成用例——都不算「TSan 通过」"
            exit 1
          fi
          ctest --test-dir build/tsan --output-on-failure -j"$(nproc)" -R "${TSAN_TEST_FILTER}"

      - name: 失败时上传用例日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-tsan
          path: build/tsan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # 静态检查：仓库里一直有 .clang-tidy（bugprone-* 等一组精选检查），但没有任何流水线跑它——
  # 等于一份没人执行的规范。这里补上。
  #
  # 当前以**报告形式**接入：存量的告警数量还没有清点过，直接把 --warnings-as-errors 打开会让
  # 每次推送都红。CI 日志里能看到全部发现；把下面的 -warnings-as-errors 改成 '*'（或先清干净
  # 存量再打开）它就成为门禁。clang-tidy 只扫本仓库源码（src/，不含 third_party/）。
  # 格式门禁：仓库已按 clang-format 23.1.1 全量排过一遍（配置见 .clang-format），这里保证不再漂。
  # 版本必须钉死到与本地同一版：换版本折行结果就变，门禁会红成一堆与改动无关的差异，那种红只会教人
  # 忽略它。检查只喂 git ls-files 的产出——即被跟踪的文件，构建产物与未跟踪的第三方落点自然排除。
  # 立这条之前先实测过：全仓跟踪的 C++ 源文件（条数由作业自己现数并打进摘要，不写死在这里）在本版下 0 违规
  # （当初那次全量格式化漏了三个文件，
  # 它们的注释在对齐组里放不下 ColumnLimit，需要人把它们挪到声明上方才能收敛）。
  formatting:
    name: 格式门禁：clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 装与本地同版的 clang-format（钉版本，不让它随 runner 漂移）
        run: |
          python3 -m venv "$HOME/fmt-venv"
          "$HOME/fmt-venv/bin/pip" install "clang-format==23.1.1"
          "$HOME/fmt-venv/bin/clang-format" --version

      - name: 全仓格式检查（先自证清单非空，再报差异；有差异即失败）
        run: |
          # 先数条数再检：`xargs -0` 拿到空输入会用**零参数**调用 clang-format，而它读空 stdin 退出 0——
          # glob 一旦失配（改扩展名、加 pathspec、checkout 出问题），这道门就从「全仓检查」变成
          # 「什么都没查还报绿」。2026-10-01 实测参与检查的是 707 个跟踪文件，下限取 500：
          # 它不是用来卡新增文件的，是用来卡「一条都没有」的
          fileCount="$(git ls-files '*.h' '*.hpp' '*.cpp' '*.cc' | wc -l)"
          echo "参与格式检查的跟踪源文件：${fileCount} 个"
          echo "### 格式门禁的输入面" >> "$GITHUB_STEP_SUMMARY"
          echo "参与检查的跟踪源文件 ${fileCount} 个（下限 500）" >> "$GITHUB_STEP_SUMMARY"
          if [ "${fileCount}" -lt 500 ]; then
            echo "清单只有 ${fileCount} 条，不像全仓——按「没跑成」处理，不把空表读成通过"
            exit 1
          fi
          # -z/-0 配对：文件名里出现空格也不会被拆开
          git ls-files -z '*.h' '*.hpp' '*.cpp' '*.cc' \
            | xargs -0 "$HOME/fmt-venv/bin/clang-format" --style=file --dry-run -Werror

      - name: 复杂度基线（最长函数只准降不准升）
        run: |
          # 这条判据挂在格式作业而不是 clang-tidy 作业：tidy 那一档按设计只报告不阻塞，
          # 挂上去等于没有门。基线里的数是现量生成的（scripts/complexity-baseline.json），
          # 越线的文件没有登记项就判红，逼着「新写的长函数要么拆、要么明写进基线」
          python3 scripts/check-complexity-baseline.py

      - name: 架构工件可追溯性（图里每条引用都要当场读得到）
        run: |
          # 九张图共 212 条 sources 引用，而 383 笔提交里零次回图——根因不是图画错了，是没有让图变红的机制。
          # 这道门管得住机械可判的那一半：引用路径不存在、行号越过文件末尾、引到空行、顶点一条证据都没有；
          # 管不住的那一半（行还在、说的已经不是那件事）由它打印的 stale 清单接手，回图时按清单逐条复核
          python3 scripts/check-arch-traceability.py

  clang-tidy:
    name: 静态检查：clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan、clang-tidy 与 run-clang-tidy
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          echo "CLANG_TIDY_BIN=$(command -v clang-tidy)" >> "$GITHUB_ENV"

      - name: 探测 Conan profile
        run: conan profile detect --force

      # 生成 compile_commands.json（clang-tidy 需要它来取每个文件的真实编译参数）
      - name: 配置（生成编译数据库）
        run: cmake --preset debug -DDATABASE_WITH_MYSQL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # -p build/debug：从编译数据库取参数；--header-filter 只看本仓库头文件；
      # run-clang-tidy 会并行处理 src/ 下的全部翻译单元
      - name: 运行 clang-tidy（报告形式，不阻塞）
        run: |
          run-clang-tidy -p build/debug -header-filter '.*[\\/]src[\\/].*' -quiet src/ 2>&1 | tee /tmp/clang-tidy.log
          {
            echo "## clang-tidy 摘要（报告形式，当前不阻塞）"
            echo '```'
            grep -cE "warning:|error:" /tmp/clang-tidy.log || echo 0
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 clang-tidy 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: /tmp/clang-tidy.log
          if-no-files-found: ignore

  # HTTP/3 互通验收：用 aioquic（独立实现）当对端，按场景打 ReferenceServer 的 h3 端点——GET 的响应头
  # 逐条核、HEAD 不许带正文、流式响应要分趟、大正文按序拼回、声明 gzip 就得真压上、扩展 CONNECT
  # （RFC 9220）隧道要回显。h3 会话用例的对端是测试自己按 RFC 排字节的（第三方实现已移出构建），
  # 它对「字节合不合规范」只算自证，这份判定必须由不认识本仓代码的实现来出。
  # 用 Release 构建：验收量的是协议能否互通，插桩只会拖慢握手。
  http3-acceptance:
    name: HTTP/3 跨实现验收：aioquic
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan 与 aioquic
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25" aioquic
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Release；Conan 依赖由 conan_provider.cmake 自动安装）
        run: cmake --preset release -DDATABASE_WITH_MYSQL=OFF

      - name: 构建 ReferenceServer 与 QUIC 跨实现探针的被测端
        run: |
          cmake --build build/release --target ReferenceServer quic_probe_server quic_probe_client

      - name: HTTP/3 跨实现验收（GET/HEAD/流式/大正文/压缩/WebSocket 隧道）
        run: ASYN_H3_CROSS_LOG=/tmp/echo-h3.log bash scripts/h3_cross_check.sh build/release "$(command -v python3)"

      # QUIC 服务端的对外行为此前由链接进来的 ngtcp2 裁定，那条裁判已拆掉：换成进程外的 aioquic，
      # 判据由独立实现的解析器给出（同树互测暴露不出共享的误解，还会跟着被测代码一起被改松）。
      - name: QUIC 跨实现验收（握手、ALPN、流收尾、drain、限额、恢复）
        run: bash scripts/quic_cross_check.sh build/release "$(command -v python3)"

      # 出站方向同一套道理，方向相反：对端换成 aioquic 起的服务端。这一条不是重复覆盖——
      # 「客户端要把回包目的标识换成服务端自报的那个」（RFC 9000 §7.2）在自家两型互测里测不出来
      # （自家服务端同时认得客户端自造的标识），只有独立实现会因为打错标识而不应答。
      - name: QUIC 出站跨实现验收（握手、ALPN、双向流的回显）
        run: bash scripts/quic_outbound_cross_check.sh build/release "$(command -v python3)"

      - name: 失败时上传服务端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: echo-h3-log
          path: /tmp/echo-h3.log
          if-no-files-found: ignore

  # 协议解码器的持续模糊：按目标分档（h1 请求、WebSocket 帧、h2 帧、h3 帧、HPACK/QPACK 头块、
  # QUIC 报文头、QUIC 帧序列、QUIC 传输参数）连同它们的
  # 依赖闭包自成一组翻译单元，不需要 Conan、不需要配置构建——脚本自己用 clang 的 libFuzzer 编一份独立
  # 产物。此前这一步只有本机手工跑（`scripts/fuzz-net.sh` 当初是为 Windows 侧写的，一轮 60 秒），
  # 回归时没有任何流水线会替我们喂随机字节，而这类解码器的历史缺陷全是越界与释放后读。
  # 违例样本落进 .fuzz/artifacts/，失败时作为工件取出，原样搬进 tests/Net/Fuzz/TestProtocolFuzz.cpp
  # 的种子用例即可常驻。
  protocol-fuzz:
    name: 协议解码器持续模糊
    runs-on: ubuntu-latest
    # 上限要按 apt 慢的那次量：v2.4.0 那次运行里，「装 clang-19 与它的 fuzzer 运行时」一步从 16:26:30
    # 拖到 16:54:57 才结束（llvm-19 / -tools / -dev 几百 MB，镜像吞吐看运气），模糊步骤只跑了 1 分多钟
    # 就被 30 分钟上限切断；同一份作业在缓存热、镜像快的运行里全程只用 6 分半。
    # 选 60 而不是 45：慢镜像那一段本身就没有上界可依赖。另外要知道**超时判成 cancelled 而不是 failed**
    # ——既不是绿也不是红，比红更难被发现，所以宁可用不完也别擦线。
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # runner 默认的 clang++ 是 18 档，而 libstdc++ 的 <expected> 守卫要求 __cpp_concepts >=
      # 202002L —— clang 19 起才满足（实测 18 在任何 -std 下都看不见 std::expected，报错落在各个
      # 头文件里）。fuzzer 运行时是按 libstdc++ 编的，换 libc++ 会在链接期报一串 std::__cxx11 未定义，
      # 所以这里装的是 clang-19 加它自己那份 fuzzer 运行时。nlohmann-json3-dev 是闭包里那处仓外
      # 头文件（Base::ConfigValue 包着它）。装包失败也会让这条作业红，但那是「拿不到裁判」，
      # 与「解码器有问题」同样需要被人看见
      - name: 装 clang-19 与它的 fuzzer 运行时（外加 nlohmann-json）
        run: |
          # 那 28 分钟里连接是「卡住但没报错」那种慢：给 apt 设重试与单次超时，让它断掉重连而不是
          # 抱着一条死连接磨到作业上限
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=25 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=25 install -y clang-19 libfuzzer-19-dev nlohmann-json3-dev

      - name: 各档解码器各跑一轮（每档 90 秒）
        run: bash scripts/fuzz-net.sh 90 -error_exitcode=1 -workers=2 -jobs=2

      # 崩溃只说明「撞坏了」，不说明「每档都在被推」：混合跑里某一档零调用也能总计数百万次。
      # 这一步按目标逐个核对读数（含「账上出现的目标必须都在清单里」那条漏配判据），
      # 并顺手验「指定单目标时没串到别类」——独立预算真生效的证据
      - name: 核对分目标读数与产量
        run: python3 scripts/check-fuzz-report.py .fuzz/log --min-executions 2000

      # 语料留 14 天：撞出来的形状要能喂回本地继续挖，也能直接搬进 gtest 的种子用例
      - name: 保留语料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: .fuzz/corpus/
          retention-days: 14
          if-no-files-found: ignore

      - name: 失败时取出崩溃样本
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: .fuzz/artifacts/
          if-no-files-found: ignore

  # 覆盖率：先补上「CI 里根本没有数字」这件事——跑一遍全量用例收 .gcda，gcovr 出行/函数/分支三份读数，
  # 再由 scripts/check-coverage-gate.py 把关：总行下限取在这里的 COVERAGE_LINE_FLOOR，
  # **逐模块**行下限与函数/分支下限取在那个脚本里（默认值按 2026-10-01 实测往下留一档：
  # 总行 77.08 / 函数 85.44 / 分支 62.38；Net 89.94、Platform 87.08、Core 84.98、Base 75.74、Database 50.50）。
  # 分模块这条是重点：本作业不带 MySQL/Redis 真库分支，Database 天然低一截，只看总数它会一直隐身。
  # 阈值故意取在实测下游——首日就红的门禁只会教会人忽略红；要提阈值，先实测，两处（env 与脚本默认值）必须同解。
  coverage:
    name: 覆盖率门禁
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      COVERAGE_LINE_FLOOR: "60"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan 与 gcovr
        run: |
          python3 -m venv "$HOME/cov-venv"
          # gcovr 要钉版：这道门的判据是「TOTAL 行里有没有百分比」与 `--gcov-ignore-parse-errors`
          # 的取值集合，两者都随 gcovr 的格式与选项漂移。容器里按同一件 8.6 复核过。
          "$HOME/cov-venv/bin/pip" install "conan>=2.25" "gcovr==8.6"
          echo "$HOME/cov-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（--coverage 插桩；关掉 sanitizer——两种插桩互相干扰，且门禁另有作业）
        run: |
          cmake -S . -B build/coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=OFF \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DDATABASE_WITH_MYSQL=OFF \
            -DASYN_BUILD_SAMPLES=OFF \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/conan_provider.cmake"

      - name: 编译全部用例（-k 0 收集式失败，一次看全所有编译错误）
        run: cmake --build build/coverage -- -k 0

      - name: 跑用例生成 .gcda
        run: ctest --test-dir build/coverage -j 4

      - name: 汇总覆盖率并按模块与总数把关
        run: |
          # gcovr 8.6 的两处坑：`--csv`/`--txt` 的取值是可选位置参数，写成 `--csv 路径` 会被后面的词吃掉
          # （实测报 OSError: Unknown directory 'n'），必须用 `--csv=路径`；`--branches`/`--txt-branches`
          # 已废弃，换成 `--txt-metric branch`。GCC 会把分支命中数报成负数（实测
          # Base/Log/LoggerRegistry.cpp:95 的 branch 2 taken -463），默认遇负即崩——崩掉就没有读数，
          # 比带着噪声出数更糟，故按 gcovr 自己提示的口径降级成每文件告警一次。
          gcovr --root "$PWD" --filter 'src/' --exclude-unreachable-branches --exclude-throw-branches \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --txt-metric branch --csv=/tmp/gcovr.csv --txt=/tmp/gcovr.txt | tee /tmp/gcovr-console.txt
          # 退出码要能穿过管道活下来：判据不押在 runner 给不给 pipefail/-e 上，显式取 PIPESTATUS[0]
          gcovr_rc=${PIPESTATUS[0]}
          if [ "$gcovr_rc" -ne 0 ]; then
            echo "gcovr 退出码 $gcovr_rc：这道门按没跑成处理，不当成「覆盖率没问题」"
            exit "$gcovr_rc"
          fi
          # 「跑过」的判据是真出一行带百分比的 TOTAL；位数不写死（8.6 打整数、旧版打小数，
          # 写死小数那一档时本作业把一份合格读数判成没跑成，红过一次）
          grep -qE "TOTAL.*[0-9]+%" /tmp/gcovr.txt || {
            echo "gcovr 没有交出汇总行（上面是它的诊断）"
            exit 1
          }
          echo "### 行覆盖率（本轮实测）" >> "$GITHUB_STEP_SUMMARY"
          grep -E "TOTAL.*[0-9]+%" /tmp/gcovr.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"
          # 阈值只在这一处判：gcovr 自己的 --fail-under-line 撤了，改由脚本吃同一个环境变量把关，
          # 另加函数/分支两条与**逐模块**下限——总数 77% 达标时 Database 只有 50.5%，
          # 聚合数会替死角掩护（本轮实测 Net 89.94 / Platform 87.08 / Core 84.98 / Base 75.74 / Database 50.50）
          python3 scripts/check-coverage-gate.py --csv /tmp/gcovr.csv --line-floor "$COVERAGE_LINE_FLOOR"

  # 示例矩阵：把 samples/ 下每个自检程序各跑一遍、按退出码判——它们是「库外消费者」形状的用例，
  # 公开契约好不好用、中间件挂法对不对，只有把这些当程序跑一遍才知道。此前 .github 里一条引用都没有，
  # 改坏一个示例不会有任何作业变红。用 Debug 档：它带 ASan + UBSan（Linux 上 ASan 默认开泄漏检测），
  # 示例自己漏的资源只有跟着这一档跑才看得见。假绿由 run_samples.py 自己兜：一个可执行体都没找到退 2；
  # ninja 清单里有这个示例、构建目录里却没有产物，也当场报「它这一次根本没跑」。
  samples:
    name: 示例矩阵：各模块自检程序（Linux）
    runs-on: ubuntu-latest
    # 这一条要全量构建（含测试与示例），冷缓存时按 coverage 那条同量级估；60 分钟留给冷启动太紧
    timeout-minutes: 90

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      # ccache 的 restore-keys 退到「本机任意一份」：本作业的源码与 build-and-test 完全同源，
      # 只有 ccache 参数前缀不同，冷启动时借那份缓存能省掉十几分钟
      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-samples-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-samples-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: 安装 Conan 与 ccache
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Debug + sanitizers + ccache）
        run: |
          cmake --preset debug -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: 构建（全部目标，含示例）
        run: cmake --build build/debug -- -k 0

      - name: 降低 ASLR 熵（稳定 AddressSanitizer）
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: 跑示例矩阵（MySQL/Redis 无凭据即按门控 SKIP）
        run: |
          # 退出码不押在 runner 给不给 pipefail 上：先收进变量，摘要打完了再照它退
          python3 scripts/run_samples.py --build build/debug --timeout 400 > /tmp/samples.log 2>&1 && rc=0 || rc=$?
          tail -24 /tmp/samples.log
          {
            echo "### 示例矩阵（Linux）"
            echo '```'
            tail -20 /tmp/samples.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # ACME 的跨实现验收：进程内那台桩机构与本仓同源、跟着一起被改，真机构那条用例又只走到「取目录 + 建号」。
  # Pebble 是 Let's Encrypt 官方那套 ACME 测试服务端（Go 写的独立实现），它把 HTTP-01 的取令牌端口配成
  # 回环可达，于是 CI 里就能走完整台 RFC 8555 状态机并把签出的链验到对面本次生成的根。
  # 这一步抓到过两个「桩不会拒」的线上不兼容：请求漏 User-Agent（Boulder/Pebble 一律 400 malformed）、
  # 机构复用已 valid 的授权时客户端又去触发那条挑战。此前它只在本地与容器跑，.github 零引用。
  acme-pebble:
    name: ACME 真机构验收：Pebble
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-acme-pebble-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-acme-pebble-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: 安装 Conan 与 ccache
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Debug + sanitizers + ccache）
        run: |
          cmake --preset debug -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # 只编签发探针这一个目标：它把整台状态机跑通，不需要测试二进制——省掉十几分钟
      - name: 构建签发探针
        run: cmake --build build/debug --target acme_issuance_probe

      - name: 取出 Pebble（镜像里的 app 与 test/）
        run: |
          image="ghcr.io/letsencrypt/pebble:latest"
          docker pull "$image"
          cid="$(docker create "$image")"
          mkdir -p /tmp/pebble-lab
          docker cp "$cid:/app" /tmp/pebble-lab/app
          docker cp "$cid:/test" /tmp/pebble-lab/test
          docker rm "$cid" >/dev/null
          chmod +x /tmp/pebble-lab/app
          ls -l /tmp/pebble-lab/app /tmp/pebble-lab/test/config/pebble-config.json

      - name: ACME 跨实现验收（状态机、续期、链与 SAN；场景数由脚本现数）
        run: |
          # 脚本的退出码分三档：0 全过、1 某场景没过（这才是被测面的问题）、2 前置缺件（拿不到裁判：
          # 镜像没拉到、探针没编出来、 openssl 缺、端口被占、通配解析没通）。2 也判红，但消息要说清是哪
          # 一档——「裁判没起来」不能读成「ACME 没问题」；具体缺哪件由脚本自己打在那一行
          bash scripts/acme_pebble_cross_check.sh build/debug /tmp/pebble-lab > /tmp/acme-pebble.log 2>&1 && rc=0 || rc=$?
          tail -20 /tmp/acme-pebble.log
          case "$rc" in
            0) echo "Pebble 验收全过" ;;
            1) echo "有场景没过：看上面的场景编号，那是被测面的问题" ;;
            *) echo "前置缺件（rc=$rc）：缺哪件见上面最后一条 [acme-cross]，属「拿不到裁判」，重跑这条作业即可复核" ;;
          esac
          {
            echo "### ACME 真机构验收（Pebble）"
            echo '```'
            tail -12 /tmp/acme-pebble.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
