# Linux CI：构建（Debug + AddressSanitizer/UBSan）并跑全量用例，含 Redis 真机集成。
#
# 与 windows-ci.yml 分工：本工作流覆盖 GCC/Linux 侧——GCC 的 ASan 会检出 MSVC 不支持的
# use-after-scope 与泄漏（测试代码的生命周期问题只有这一侧能兜住）；Redis 集成用例连真实服务。
# MySQL 依赖只在覆盖率作业里装（libmysqlclient 走 Conan，缓存键与 mysql-driver-compile 共用）；
# 其余作业仍跳过（ASYN_SKIP_MYSQL_DEPS=1），那里的 MySQL 集成用例按环境变量跳过。
#
# 全量用例拆成三个分片并行跑（platform-base-core / net / database）：分片按 tests/ 下的子目录切，
# 新用例只要落在对应目录就会被自动带上，不需要维护名字清单。编译输出由 ccache 缓存——分片会让
# Platform/Base/Core 这些公共依赖被重复编译，命中缓存之后这份重复就不再花时间。
# Redis 只在 database 分片里起；版本号门禁在 release-gate.yml（那条工作流不被路径过滤跳过）。

name: Linux 门禁

on:
  # main 与 develop 的推送都跑（2026-10-17 起把 develop 也纳入：真机用例一族过去只在合进 main
  # 之后才第一次见 CI，红了才发现）。PR 仍不触发；免费分钟数有限，一次全量构建+用例几十个 runner 分钟，
  # 要只验证某个提交就手动 dispatch。
  push:
    branches: [ main, develop ]
    # 纯文档改动与工作流自身的改动不值得等构建；版本号门禁在 release-gate.yml，那条不受这里影响
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: 构建与全量用例 · ${{ matrix.shard.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      # 一个分片红不该掩盖其它分片的结果：三个都跑完再收工
      fail-fast: false
      matrix:
        shard:
          - name: platform-base-core
            label: Platform / Base / Core
            targets: "TestPlatform TestBase TestCore"
            testDirectories: "tests/Platform tests/Base tests/Core"
            redis: "0"
          - name: net
            label: Net
            targets: "TestNet ReferenceServer"
            testDirectories: "tests/Net"
            redis: "0"
          - name: database
            label: Database
            targets: "TestDatabase"
            testDirectories: "tests/Database"
            redis: "1"

    env:
      # Conan 的包缓存搬到仓库内，便于下面的 actions/cache 缓存它
      CONAN_HOME: ${{ github.workspace }}/.conan2
      # 跳过 MySQL 客户端依赖的理由见文件头
      ASYN_SKIP_MYSQL_DEPS: "1"
      # ccache：Debug + ASan 的目标文件偏大，上限与压缩都按这个量级给
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      # 分片各存各的缓存，回退键吃到同平台其它分片留下的公共部分：Platform/Base/Core 的目标
      # 文件三个分片都要编，命中回退键就把这份重复省掉（缓存一经写入不可覆盖，因此键里带分片名）
      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.shard.name }}-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.shard.name }}-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      # ubuntu-latest 的 pip 受 PEP 668 限制不能直接装包，先建虚拟环境再进 PATH
      - name: 安装 Conan 与 ccache
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Debug + sanitizers + ccache；Conan 依赖由 conan_provider.cmake 自动安装）
        run: |
          cmake --preset debug -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # 零告警是本仓库的提交硬判据：构建失败与告警都会让这一步红
      # `-- -k 0`：一次编译完所有目标，把全部告警一次收齐——逐个文件报错时，
      # 修一轮要等一整轮 CI，收集式失败才能一轮改完
      # 只编本分片要用的目标（连同它们的依赖），三个分片并起来仍是全量
      - name: 构建（本分片的目标）
        run: cmake --build build/debug --target ${{ matrix.shard.targets }} -- -k 0

      # GitHub 的 ubuntu runner 上 vm.mmap_rnd_bits=32 时 AddressSanitizer 有随机崩溃的
      # 已知问题，调低 ASLR 熵规避；失败不阻塞（本地同为 32 且稳定，此处属保险）
      - name: 降低 ASLR 熵（稳定 AddressSanitizer）
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      # Redis 集成用例需要真实服务与口令；口令运行时随机生成并加掩码，仓库零明文口令
      - name: 启动 Redis（随机口令）
        if: matrix.shard.redis == '1'
        run: |
          REDIS_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$REDIS_PASSWORD"
          echo "REDIS_PASSWORD=$REDIS_PASSWORD" >> "$GITHUB_ENV"
          # 到 Docker Hub 的 token 请求会整片超时（2026-10-09 这一档与 Autobahn 那一档同因红过），
          # 一次超时不等于镜像不存在：给三次带时限的尝试，退避后仍不成才让作业响
          for attempt in 1 2 3; do
            if timeout 240 docker run -d --name ci-redis -p 6379:6379 redis:7 redis-server --requirepass "$REDIS_PASSWORD"; then
              break
            fi
            # 拉取中断会留下同名却没起来的容器，不清掉下一次必然名字冲突
            docker rm -f ci-redis >/dev/null 2>&1 || true
            if [ "$attempt" = 3 ]; then
              echo "::error::redis:7 三次都没能拉起（Docker Hub 侧超时），Redis 集成用例没有裁判可用" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          for attempt in $(seq 1 30); do
            if docker exec ci-redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "Redis 未在 30 秒内就绪，容器日志：" >&2
          docker logs ci-redis >&2
          exit 1

      # 按 tests/ 下的子目录跑 ctest：每个分片只跑自己那一批，用例清单由 gtest_discover_tests
      # 在构建期生成，新增用例落在对应目录里就会自动进来
      - name: 用例（本分片）
        run: |
          if [ "${{ matrix.shard.redis }}" = "1" ]; then
            export ASYN_REDIS_TEST_HOST=127.0.0.1
            export ASYN_REDIS_TEST_PASSWORD="$REDIS_PASSWORD"
          fi
          for testDirectory in ${{ matrix.shard.testDirectories }}; do
            ctest --test-dir "build/debug/$testDirectory" --output-on-failure -j"$(nproc)"
          done

      - name: 失败时上传用例日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-linux-${{ matrix.shard.name }}
          path: build/debug/tests/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # 跨实现一致性验收（HTTP/2 与 WebSocket）：拿独立实现当对端，把「两边都按 RFC 办事」变成每次
  # 合入都跑的判据，而不是一次性手工结论。自写客户端只会重复本框架自己对协议的理解，两边一起错的
  # 地方查不出来——h2c 那条探针就是这样查出一条取消会带走整条连接的问题。
  #
  # 跑的是 scripts/ 下那几条与手动完全相同的脚本（挂上 CI 只为不让它们烂掉）：
  # h2_adversarial_probe.sh（curl 自带 nghttp2）、ws_interop_probe.py（websockets）、
  # websocket_autobahn.sh（Autobahn|Testsuite 的 517 条用例，官方镜像）。
  # h3 那侧已有 http3-acceptance 作业跑 aioquic，这里不重复；Windows 侧不建这个作业：
  # 本机 mingw 的 curl 编译时没带 HTTP/2，--http2-prior-knowledge 直接报「不支持」，
  # 等于跑给空气看。
  #
  # 三台服务端的分工写在下面那一步里（--h2c 会把同一端口的明文连接全部收走，不再服务 h1）。
  #
  # 计时余量给的是 Autobahn：517 条用例里有 4 MiB / 8 MiB 的大消息往返与 permessage-deflate 的
  # 各形分片，而这里跑的是 Debug + ASan 那台服务端（release 侧本机实测整轮约 13 分钟）。
  protocol-conformance:
    name: 规范裁判：h2spec 与 Autobahn
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-conformance-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-conformance-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      # websockets 与 Conan 同放一个 venv：ubuntu-latest 的系统 pip 受 PEP 668 限制不能直接装包。
      # ccache 必须在这里装上：下面配置传了 COMPILER_LAUNCHER=ccache，CMake 不校验它存不存在，
      # 缺了就变成每条编译命令 /bin/sh: ccache: not found（构建以 127 退出，整条裁判链跑不起来）
      - name: 安装 Conan、ccache 与独立 WebSocket 实现
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25" websockets
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Debug + sanitizers + ccache）
        run: |
          cmake --preset debug -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # 探针只需要「一个能跑的服务端」，示例服务器就是它：h2c / TLS 的开关都齐
      - name: 构建 ReferenceServer
        run: cmake --build build/debug --target ReferenceServer -- -k 0

      # h2spec 是别人写的 HTTP/2 裁判：146 条判据直接引 RFC 的句子，自家探针查不出的
      # 「两边都错在同一种理解上」由它查。取固定版本的官方发布包（不自己编 Go），失败就让它红——
      # 拿不到裁判与裁判判不过，都需要被人看见
      - name: 取 h2spec（跨实现一致性裁判）
        run: |
          set -euo pipefail
          h2spec_version=v2.6.0
          # 官方发布包的 sha256（2026-10-11 现下现算，两次独立完成的下载同值）：钉住它，
          # 「同一提交两个日子被不同内容的裁判判定」与中间链路换包都会在下载那一刻红。
          # 升级版本时连它一起换（换完用 sha256sum 现算，并复核 h2spec --version 报的版本）
          h2spec_sha256=157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318
          curl -sSfL -o /tmp/h2spec.tgz \
            "https://github.com/summerwind/h2spec/releases/download/${h2spec_version}/h2spec_linux_amd64.tar.gz"
          echo "${h2spec_sha256}  /tmp/h2spec.tgz" | sha256sum -c -
          tar -xzf /tmp/h2spec.tgz -C /tmp
          /tmp/h2spec --version

      - name: 降低 ASLR 熵（稳定 AddressSanitizer）
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: 起服务端并跑跨实现探针
        run: |
          # 最后一个参数是 URL，其余全转给 curl；等到真能应答才开测——ASan 下的启动比平时慢，
          # 不等就绪就会拿到「000」这种与协议无关的红
          wait_ready() {
            local url="${*:$#}"
            local extra=("${@:1:$#-1}")
            for _ in $(seq 1 60); do
              if curl -s -o /dev/null --max-time 2 "${extra[@]}" "$url"; then return 0; fi
              sleep 0.5
            done
            echo "服务端没在 30 秒内应答：$url" >&2
            return 1
          }

          # 18080：h2c + /metrics（那条探针要读计数）。--h2c 会把明文连接一律收进 HTTP/2，
          # 同一端口不再服务 HTTP/1.1，所以下面的 WebSocket 探针必须另开一台明文 h1 的服务端
          build/debug/samples/ReferenceServer --port 18080 --threads 2 --metrics --h2c > /tmp/h2c.log 2>&1 &
          h2c_pid=$!
          # 18081 这台要能被容器访问到：Autobahn 跑在另一个网络命名空间里，经 host-gateway 回到宿主，
          # 而 ReferenceServer 默认只听 localhost（Docker Desktop 的代理能进宿主回环，Linux 不能 →
          # 表现就是 wstest 起来了却「Connection refused」，一条用例都跑不完）
          build/debug/samples/ReferenceServer --host 0.0.0.0 --port 18081 --threads 2 --metrics > /tmp/plain.log 2>&1 &
          plain_pid=$!
          # 18443：TLS。wss 走 TCP+ALPN，对端只报 http/1.1 时就按 h1 服务（这正是它要协商到的形态）
          build/debug/samples/ReferenceServer --port 18443 --threads 1 --https \
            --cert tests/Core/fixtures/test_cert.pem --key tests/Core/fixtures/test_key.pem \
            > /tmp/tls.log 2>&1 &
          tls_pid=$!

          # 都要跑完再收：任一失败就让作业红，并把服务端日志留成产物。
          # 退码保真：用 `status=$?` 而不是 `status=1`——autobahn 的 2（拿不到裁判/没跑完）与 1（某条
          # 用例没过）成因不同、下一步不同，折成一个 1 会让「runner 掐了容器」看起来像服务端规范失败
          status=0
          wait_ready --http2-prior-knowledge "http://127.0.0.1:18080/json" \
            && bash scripts/h2_adversarial_probe.sh 18080 || status=$?
          # 同一台 h2c 服务端再过一次外部裁判；--strict 把那几条「实现可选」的也一并判了
          wait_ready --http2-prior-knowledge "http://127.0.0.1:18080/json" \
            && /tmp/h2spec -h 127.0.0.1 -p 18080 --strict || status=$?
          # TLS 侧走 ALPN 挑出 h2：与明文那条判的是同一套规则，但走的是另一条协商路径
          wait_ready -k "https://127.0.0.1:18443/json" \
            && /tmp/h2spec -h 127.0.0.1 -p 18443 --tls --insecure || status=$?
          wait_ready "http://127.0.0.1:18081/json" \
            && python scripts/ws_interop_probe.py 127.0.0.1 18081 || status=$?
          # Autobahn|Testsuite：另一家独立实现的 517 条用例，判的是「期望的事件序列」。
          # 本机这一轮由它查出「回显不分类型一律发文本帧」与「单帧上限比消息上限还小」两处。
          # 默认排掉超本端 8 MiB 消息上限的那两条（按 §7.1.6 回 1009 属规范许可的拒绝），见脚本头
          wait_ready "http://127.0.0.1:18081/json" \
            && bash scripts/websocket_autobahn.sh 18081 || status=$?
          wait_ready -k "https://127.0.0.1:18443/json" \
            && python scripts/ws_interop_probe.py 127.0.0.1 18443 --wss || status=$?

          kill "$h2c_pid" "$plain_pid" "$tls_pid" 2>/dev/null
          wait "$h2c_pid" "$plain_pid" "$tls_pid" 2>/dev/null
          exit "$status"

      - name: 失败时上传服务端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-server-logs
          path: /tmp/*.log
          if-no-files-found: ignore

  # MySQL 真机驱动分支的编译覆盖：除覆盖率作业外，其余作业一律 ASYN_SKIP_MYSQL_DEPS=1 +
  # -DDATABASE_WITH_MYSQL=OFF，于是 MySqlConnection/MySqlResult 那些源文件在那些作业里从不参与编译，
  # 连语法/类型错误都不会红。这个作业只构建 Database 目标，不做真机连接测试（真机那一路在 coverage）。
  #
  # 成本：libmysqlclient 在 ConanCenter 上只有源码包，第一次跑要现场编译十几分钟；之后
  # CONAN_HOME 被 actions/cache 缓存（key 与其它作业相同），后续运行几乎是白拿。
  mysql-driver-compile:
    name: MySQL 驱动的编译档
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      # 这个作业存在的意义就是要它——不设 ASYN_SKIP_MYSQL_DEPS

    steps:
      - uses: actions/checkout@v4

      # 缓存键必须与不带 mysql 的作业不同：共用键会让「先命中的那个作业」把缓存内容钉死。
      # 那些作业的依赖集里没有 libmysqlclient，若共用键，命中它们的缓存后本作业
      # 仍要回退去现场编译 MySQL 驱动（或反过来把他的缓存顶掉），缓存等于白设。
      # 注意 GitHub Actions 的缓存一经写入不可覆盖，所以两类依赖集必须各占一个键。
      # coverage 作业的依赖集与本作业相同，因此它也用这一个键（白拿）。
      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-mysql-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（只编库本体，开 MySQL 真机分支）
        run: |
          cmake -S . -B build/mysql-driver-check -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDATABASE_WITH_MYSQL=ON \
            -DASYN_BUILD_TESTS=OFF \
            -DASYN_BUILD_SAMPLES=OFF \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/conan_provider.cmake"

      - name: 编译 Database（含真机驱动分支；告警同样是失败）
        run: cmake --build build/mysql-driver-check --target Database -- -k 0

  # io_uring 事件后端：编译并且真的跑一遍用例。该分支只在显式开关下参与编译（默认走 epoll），
  # 而三后端共用一套契约、多数断言在 epoll 后端下恒绿——只在一台后端上跑等于没测（io_uring 不校验
  # 描述符、改掩码时机与 epoll 不同，这两处真实偏离就是这么找到的）。内核不放行 io_uring 时跳过运行
  # 而不是让全仓 PR 变红：这一步要抓的是后端契约回归，不是 runner 的内核策略。
  #
  # mimalloc 分支不在其中：它要先在 conanfile 里声明依赖（find_package(mimalloc REQUIRED)），
  # 而本仓库的 Conan 依赖清单里没有它——加作业之前得先补依赖，见 PR 说明。
  io-uring-compile:
    name: io_uring 的编译档
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（io_uring 事件后端；带上用例，否则等于只编了一遍）
        run: |
          cmake -S . -B build/io-uring-check -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DASYN_WITH_IO_URING=ON \
            -DDATABASE_WITH_MYSQL=OFF \
            -DASYN_BUILD_TESTS=ON \
            -DASYN_BUILD_SAMPLES=OFF \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/conan_provider.cmake"

      - name: 编译 Core 与 Core 用例（io_uring 分支；告警同样是失败）
        run: cmake --build build/io-uring-check --target TestCore -- -k 0

      - name: 探测本 runner 是否放行 io_uring
        id: uring-usable
        run: |
          disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 0)
          # 两个分支都把结论写进摘要：跳过跑用例是「这一轮没验过」，不能只在日志里留一句警告
          if [ "$disabled" != "0" ]; then
            echo "isUsable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::内核已禁用 io_uring（io_uring_disabled=$disabled），本作业退化为只编译"
            echo "io_uring 的编译档：内核禁用（io_uring_disabled=$disabled），本轮只编译、未跑用例" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "isUsable=true" >> "$GITHUB_OUTPUT"
            echo "io_uring 的编译档：内核放行，本轮真跑事件循环与后端契约用例" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 跑事件循环与后端契约用例（io_uring 后端）
        if: steps.uring-usable.outputs.isUsable == 'true'
        run: |
          # --no-tests=error：筛面失配（一条都没选中）判红而不是静默绿——「什么都没跑」与
          # 「全跑绿」外观同形；筛面词表被改坏或 ctest 名单为空都由这一条兜住
          ctest --test-dir build/io-uring-check \
            -R "Epoll|IoWatcher|Timer|TimerQueue|EventLoop|Scheduler|ThreadPool|IoContext|Uring" \
            -j 4 --no-tests=error --output-on-failure

  # 线程竞态检测：TSan 与 ASan 互斥（不能同时插桩），因此另起一个构建目录，只跑并发相关的
  # 用例集，把 CI 时间压在可接受范围（本机 Linux 上可以直接跑全量）。事件循环、线程池与跨循环
  # 投递（scheduleRemote / 全局队列 / TimerQueue 唤醒）此前只有注释级约定，这里是唯一的自动兜底。
  thread-sanitizer:
    name: ThreadSanitizer：线程契约
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      # 与 build-and-test 同源的 ccache：同样的源码、不同的插桩选项，ccache 按参数分开存，
      # 互不干扰
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
      # 筛面只在这一处定义：数命中的条数与真正跑它用的是同一个串，两处不会各说一套。
      # `ServiceWatchdog` 是 2026-10-10 补进来的：那批用例把拍协程挂在多条循环上、多条线程读写同一张
      # 进度表与那份非线程安全的通知发送，是本轮新增的跨线程面，而类名不在旧 21 个词里就一条都不跑。2026-10-11 再补六类词：`Tracer`（出口线程）、`Reload`（SIGHUP 移交）、`Http3`、`Middleware`、`Budget`、`CoroutinePool`——这几类的跨线程用例此前一条都不进 TSan 档（审计 F2-14）
      # 2026-10-12 再补两类（审计 F3-08）：`Tls`（指纹名单的校验回调在握手线程读、setter 在配置线程换，
      # 对应 ConcurrentHandshakeAndAllowlistUpdatesRemainSafeWithSharedRegistry）与 `Crash`（崩溃处理器
      # 在多线程进程里的投递面，对应 FatalSignalFromOneOfMultipleThreadsStillLeavesSceneAndDiesBySignal）
      TSAN_TEST_FILTER: "Scheduler|Thread|Timer|EventLoop|IoWatcher|TcpServer|TcpAcceptor|TcpStream|Connection|HttpSession|HttpStreaming|Http2|WebSocket|FileWatcher|EventNotifier|AsyncSink|ConnectionPool|AsyncExecutor|Logger|Config|WorkerSupervisor|ServiceWatchdog|Tracer|Reload|Http3|Middleware|Budget|CoroutinePool|Tls|Crash"
      # 筛面下限：2026-10-01 实测命中 1325 / 全量 3669，往下留一档。
      # 掉到这条线以下有两种真相：类名改了，或新增的跨线程面根本不在这 30 个词里——
      # 两者的外观都与「TSan 全绿」同形，所以判据必须钉在条数上而不是只跑一次
      TSAN_MIN_MATCHED: "1200"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-tsan-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-tsan-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: 安装 Conan 与 ccache
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      # 复用 debug 预设（含 -g 与 Ninja），但把目录换成 build/tsan，并关掉 ASan、只留 TSan
      - name: 配置（Debug + ThreadSanitizer + ccache）
        run: |
          cmake --preset debug -B build/tsan -DSANITIZE_THREADS=ON -DENABLE_SANITIZERS=OFF -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: 构建
        run: cmake --build build/tsan

      - name: 降低 ASLR 熵（稳定 Sanitizer）
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: 并发相关用例集（TSan，先报筛面再跑）
        # WorkerSupervisor 在列：它是 Core 里唯一「另一个线程可以来读」的进程编排——观察线程
        # 与编排线程碰同一批 worker 句柄。这类竞态只有 TSan 看得见，MSVC 侧根本不编这个用例
        run: |
          # 先数「这条正则实际筛到多少条」：TSan 是按类名筛的，一个新增的跨线程面只要名字里
          # 不含那 28 个词就一条都不跑，而作业照样全绿。把条数打进摘要并钉下限，才有东西可红。
          # 条数取 ctest 自己那行 Total Tests：按 grep -c "Test #" 数会漏掉编号不足四位的那些
          # （ctest 给 #1..#999 打两个空格、#1000 起打一个空格），本机实测两种数法差 999 条
          totalCount="$(ctest --test-dir build/tsan -N | sed -n 's/^Total Tests: //p')"
          matchedCount="$(ctest --test-dir build/tsan -N -R "${TSAN_TEST_FILTER}" | sed -n 's/^Total Tests: //p')"
          echo "TSan 筛面：命中 ${matchedCount} / 全量 ${totalCount} 条（下限 ${TSAN_MIN_MATCHED}）"
          echo "### TSan 的覆盖面" >> "$GITHUB_STEP_SUMMARY"
          echo "命中 ${matchedCount} / 全量 ${totalCount} 条，下限 ${TSAN_MIN_MATCHED}（其余用例不在 TSan 档跑）" >> "$GITHUB_STEP_SUMMARY"
          if [ "${matchedCount}" -lt "${TSAN_MIN_MATCHED}" ]; then
            echo "筛面只剩 ${matchedCount} 条：要么类名改了，要么这份构建根本没生成用例——都不算「TSan 通过」"
            exit 1
          fi
          ctest --test-dir build/tsan --output-on-failure -j"$(nproc)" -R "${TSAN_TEST_FILTER}"

      - name: 失败时上传用例日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-tsan
          path: build/tsan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # 静态检查：仓库里一直有 .clang-tidy（bugprone-* 等一组精选检查），但没有任何流水线跑它——
  # 等于一份没人执行的规范。这里补上。
  #
  # 当前以报告形式接入：存量的告警数量还没有清点过，直接把 --warnings-as-errors 打开会让
  # 每次推送都红。CI 日志里能看到全部发现；把下面的 -warnings-as-errors 改成 '*'（或先清干净
  # 存量再打开）它就成为门禁。clang-tidy 只扫本仓库源码（src/，不含 third_party/）。
  # 格式门禁：仓库已按 clang-format 23.1.1 全量排过一遍（配置见 .clang-format），这里保证不再漂。
  # 版本必须钉死到与本地同一版：换版本折行结果就变，门禁会红成一堆与改动无关的差异，那种红只会教人
  # 忽略它。检查只喂 git ls-files 的产出——即被跟踪的文件，构建产物与未跟踪的第三方落点自然排除。
  # 立这条之前先实测过：全仓跟踪的 C++ 源文件（条数由作业自己现数并打进摘要，不写死在这里）在本版下 0 违规
  # （当初那次全量格式化漏了三个文件，
  # 它们的注释在对齐组里放不下 ColumnLimit，需要人把它们挪到声明上方才能收敛）。
  formatting:
    name: 格式门禁：clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 这道门要拿图里钉的修订算新鲜度，浅克隆里没有那个修订就取不到基准——
      # 默认深度 1 会让脚本退 2（它现在把「取不到基准」判成红），所以要完整历史
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装与本地同版的 clang-format（钉版本，不让它随 runner 漂移）
        run: |
          python3 -m venv "$HOME/fmt-venv"
          "$HOME/fmt-venv/bin/pip" install "clang-format==23.1.1"
          "$HOME/fmt-venv/bin/clang-format" --version

      - name: 全仓格式检查（先自证清单非空，再报差异；有差异即失败）
        run: |
          # 先数条数再检：`xargs -0` 拿到空输入会用零参数调用 clang-format，而它读空 stdin 退出 0——
          # glob 一旦失配（改扩展名、加 pathspec、checkout 出问题），这道门就从「全仓检查」变成
          # 「什么都没查还报绿」。2026-10-01 实测参与检查的是 707 个跟踪文件，下限取 500：
          # 它不是用来卡新增文件的，是用来卡「一条都没有」的
          fileCount="$(git ls-files '*.h' '*.hpp' '*.cpp' '*.cc' | wc -l)"
          echo "参与格式检查的跟踪源文件：${fileCount} 个"
          echo "### 格式门禁的输入面" >> "$GITHUB_STEP_SUMMARY"
          echo "参与检查的跟踪源文件 ${fileCount} 个（下限 500）" >> "$GITHUB_STEP_SUMMARY"
          if [ "${fileCount}" -lt 500 ]; then
            echo "清单只有 ${fileCount} 条，不像全仓——按「没跑成」处理，不把空表读成通过"
            exit 1
          fi
          # -z/-0 配对：文件名里出现空格也不会被拆开
          git ls-files -z '*.h' '*.hpp' '*.cpp' '*.cc' \
            | xargs -0 "$HOME/fmt-venv/bin/clang-format" --style=file --dry-run -Werror

      - name: 复杂度基线（最长函数只准降不准升）
        run: |
          # 这条判据挂在格式作业而不是 clang-tidy 作业：tidy 那一档按设计只报告不阻塞，
          # 挂上去等于没有门。基线里的数是现量生成的（scripts/complexity-baseline.json），
          # 越线的文件没有登记项就判红，逼着「新写的长函数要么拆、要么明写进基线」
          python3 scripts/check-complexity-baseline.py

      - name: 架构工件可追溯性（图里每条引用都要当场读得到）
        run: |
          # 九张图把 src 里的每条引用钉在自己的修订上（条数只看脚本自己打印的 TOTAL_REFS，这里不复述一份，
          # 免得复述与真源分叉），而 383 笔提交里零次回图——根因不是图画错了，是没有让图变红的机制。
          # 这道门管得住机械可判的那一半：引用路径不存在、行号越过文件末尾、引到空行、顶点一条证据都没有；
          # 管不住的那一半（行还在、说的已经不是那件事）由它打印的 stale 清单接手，回图时按清单逐条复核
          python3 scripts/check-arch-traceability.py

      - name: 台账日期机检（紧形状「提交号（日期）」与 git 作者日期同解）
        run: |
          # 只吃「`提交号`（YYYY-MM-DD）」这一种紧形状：散句里的日期常说的是别的事，硬判会做出哭狼的门。
          # 挂在格式档而不是别处：这一步已经 fetch-depth: 0，脚本要拿被引提交自己的作者日期。
          # 取不到 git、扫描清单为空、文件读不到都退 2——「什么都没查」不许被读成通过
          python3 scripts/check-ledger-dates.py

      - name: 公开接口面基线（声明级 diff，与 MAJOR 联动）
        run: |
          # 同一道判据在发布门禁也跑一次（那条任何改动都跑、只在 main 上），这里挂着是为了
          # 让 develop 与 PR 当天就知道「这次改破了公开面」，而不是等合进 main 才发现。
          # 判据只读源码与 CMake 的安装规则，不建不链
          python3 scripts/check-api-baseline.py

  clang-tidy:
    name: 静态检查：clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan、clang-tidy 与 run-clang-tidy
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          echo "CLANG_TIDY_BIN=$(command -v clang-tidy)" >> "$GITHUB_ENV"

      - name: 探测 Conan profile
        run: conan profile detect --force

      # 生成 compile_commands.json（clang-tidy 需要它来取每个文件的真实编译参数）
      - name: 配置（生成编译数据库）
        run: cmake --preset debug -DDATABASE_WITH_MYSQL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # -p build/debug：从编译数据库取参数；--header-filter 只看本仓库头文件；
      # run-clang-tidy 会并行处理 src/ 下的全部翻译单元
      - name: 运行 clang-tidy（报告形式，不阻塞）
        run: |
          run-clang-tidy -p build/debug -header-filter '.*[\\/]src[\\/].*' -quiet src/ 2>&1 | tee /tmp/clang-tidy.log
          # 退出码要能穿过管道活下来：判据不押在 runner 给不给 pipefail/-e 上，显式取 PIPESTATUS[0]
          clang_tidy_rc=${PIPESTATUS[0]}
          diagnostic_count=$(grep -cE "warning:|error:" /tmp/clang-tidy.log || true)
          {
            echo "## clang-tidy 摘要（报告形式，当前不阻塞）"
            echo '```'
            echo "退出码 ${clang_tidy_rc}、诊断 ${diagnostic_count} 行"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 「报告形式」不等于怎么坏都绿：rc>=2 是工具的硬错误（编译数据库缺、工具崩），
          # rc=1 却一条诊断都没有同样是「没跑成」的形状（跑出发现项的 rc=1 必然带着诊断行）——
          # 把 rc 丢掉时这两种都会读成「零诊断=干净」。发现项本身（rc=1 且有诊断）照旧不阻塞
          if [ "$clang_tidy_rc" -ge 2 ] || { [ "$clang_tidy_rc" -ne 0 ] && [ "$diagnostic_count" -eq 0 ]; }; then
            echo "run-clang-tidy 退出码 ${clang_tidy_rc}、诊断 ${diagnostic_count} 行：这道步按没跑成处理"
            exit "$clang_tidy_rc"
          fi

      - name: 上传 clang-tidy 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: /tmp/clang-tidy.log
          if-no-files-found: ignore

  # HTTP/3 互通验收：用 aioquic（独立实现）当对端，按场景打 ReferenceServer 的 h3 端点——GET 的响应头
  # 逐条核、HEAD 不许带正文、流式响应要分趟、大正文按序拼回、声明 gzip 就得真压上、扩展 CONNECT
  # （RFC 9220）隧道要回显。h3 会话用例的对端是测试自己按 RFC 排字节的（第三方实现已移出构建），
  # 它对「字节合不合规范」只算自证，这份判定必须由不认识本仓代码的实现来出。
  # 用 Release 构建：验收量的是协议能否互通，插桩只会拖慢握手。
  http3-acceptance:
    name: HTTP/3 跨实现验收：aioquic
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan 与 aioquic
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25" aioquic
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Release；Conan 依赖由 conan_provider.cmake 自动安装）
        run: cmake --preset release -DDATABASE_WITH_MYSQL=OFF

      # 全树而不是只建三个验收产物：GCC 13 在 -O3 下的诊断（如 WebSocketClient 那处
      # optional<string> 的 maybe-uninitialized 假阳性）只有这一档能抓到，定向构建会让它们
      # 在 CI 里继续隐身。验收本身仍只用 ReferenceServer/quic_probe_*，不额外跑用例（时长考虑）。
      - name: 全树构建（Release/-O3；跨实现验收只用其中三个产物）
        run: |
          cmake --build build/release -- -k 0

      - name: HTTP/3 跨实现验收（GET/HEAD/流式/大正文/压缩/WebSocket 隧道）
        run: ASYN_H3_CROSS_LOG=/tmp/echo-h3.log bash scripts/h3_cross_check.sh build/release "$(command -v python3)"

      # QUIC 服务端的对外行为此前由链接进来的 ngtcp2 裁定，那条裁判已拆掉：换成进程外的 aioquic，
      # 判据由独立实现的解析器给出（同树互测暴露不出共享的误解，还会跟着被测代码一起被改松）。
      - name: QUIC 跨实现验收（握手、ALPN、流收尾、drain、限额、恢复）
        run: bash scripts/quic_cross_check.sh build/release "$(command -v python3)"

      # 出站方向同一套道理，方向相反：对端换成 aioquic 起的服务端。这一条不是重复覆盖——
      # 「客户端要把回包目的标识换成服务端自报的那个」（RFC 9000 §7.2）在自家两型互测里测不出来
      # （自家服务端同时认得客户端自造的标识），只有独立实现会因为打错标识而不应答。
      - name: QUIC 出站跨实现验收（握手、ALPN、双向流的回显）
        run: bash scripts/quic_outbound_cross_check.sh build/release "$(command -v python3)"

      # 换代时监听套接字交不交得出去：镜像与 systemd 单元装的就是 ReferenceServer 这个二进制，
      # 库里那段 adopt（Core::adoptHandedOverListener 与各 adopt 构造子）有单测，而示例的命令行接线
      # 只有真起进程才测得出来。这一档钉的四件事都容易在改动静默处漏：接管形状下不许再 bind
      # （strace 记，重复 listen 的实测症状是「端口换了、原服务不再应答」而不是报错）、交来的数据报
      # 套接字上 h3 要真应答（不看 alt-svc 那种静态通告，服务没起来也照发）、LISTEN_PID 不符要忽略并
      # 打说明、换代后老连接那条目的标识要换回一枚与交棒方宣告值逐字相同的无状态重置。
      - name: 监听套接字交接与 socket activation 实测
        run: |
          command -v strace > /dev/null || sudo apt-get install -y strace
          python3 scripts/fd_takeover_probe.py --server build/release/samples/ReferenceServer \
              --cert tests/Core/fixtures/test_localhost_cert.pem \
              --key tests/Core/fixtures/test_localhost_key.pem

      - name: 失败时上传服务端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: echo-h3-log
          path: /tmp/echo-h3.log
          if-no-files-found: ignore

  # 协议解码器的持续模糊：按目标分档（h1 请求、WebSocket 帧、h2 帧、h3 帧、HPACK/QPACK 头块、
  # permessage-deflate 压缩、出站 h1 响应、QUIC 报文头、QUIC 帧序列、QUIC 传输参数）连同它们的
  # 依赖闭包自成一组翻译单元，不需要 Conan、不需要配置构建——脚本自己用 clang 的 libFuzzer 编一份独立
  # 产物。此前这一步只有本机手工跑（`scripts/fuzz-net.sh` 当初是为 Windows 侧写的，一轮 60 秒），
  # 回归时没有任何流水线会替我们喂随机字节，而这类解码器的历史缺陷全是越界与释放后读。
  # 违例样本落进 .fuzz/artifacts/，失败时作为工件取出，原样搬进 tests/Net/Fuzz/TestProtocolFuzz.cpp
  # 的种子用例即可常驻。
  protocol-fuzz:
    name: 协议解码器持续模糊
    runs-on: ubuntu-latest
    # 上限要按 apt 慢的那次量：v2.4.0 那次运行里，「装 clang-19 与它的 fuzzer 运行时」一步从 16:26:30
    # 拖到 16:54:57 才结束（llvm-19 / -tools / -dev 几百 MB，镜像吞吐看运气），模糊步骤只跑了 1 分多钟
    # 就被 30 分钟上限切断；同一份作业在缓存热、镜像快的运行里全程只用 6 分半。
    # 选 60 而不是 45：慢镜像那一段本身就没有上界可依赖。另外要知道超时判成 cancelled 而不是 failed
    # ——既不是绿也不是红，比红更难被发现，所以宁可用不完也别擦线。
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # runner 默认的 clang++ 是 18 档，而 libstdc++ 的 <expected> 守卫要求 __cpp_concepts >=
      # 202002L —— clang 19 起才满足（实测 18 在任何 -std 下都看不见 std::expected，报错落在各个
      # 头文件里）。fuzzer 运行时是按 libstdc++ 编的，换 libc++ 会在链接期报一串 std::__cxx11 未定义，
      # 所以这里装的是 clang-19 加它自己那份 fuzzer 运行时。nlohmann-json3-dev 是闭包里那处仓外
      # 头文件（Base::ConfigValue 包着它）。装包失败也会让这条作业红，但那是「拿不到裁判」，
      # 与「解码器有问题」同样需要被人看见
      - name: 装 clang-19 与它的 fuzzer 运行时（外加 nlohmann-json 与 zlib）
        run: |
          # 那 28 分钟里连接是「卡住但没报错」那种慢：给 apt 设重试与单次超时，让它断掉重连而不是
          # 抱着一条死连接磨到作业上限
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=25 update
          # zlib1g-dev：permessage-deflate 档包着 zlib，闭包链接要 -lz（见 scripts/fuzz-net.sh 的 sources 说明）。
          # libssl-dev：JWT 档的 JwtVerifier.cpp 用 EVP/BN/param_build，闭包链接要 -lcrypto
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=25 install -y clang-19 libfuzzer-19-dev nlohmann-json3-dev zlib1g-dev libssl-dev

      - name: 各档解码器各跑一轮（每档 90 秒）
        run: bash scripts/fuzz-net.sh 90 -error_exitcode=1 -workers=2 -jobs=2

      # 崩溃只说明「撞坏了」，不说明「每档都在被推」：混合跑里某一档零调用也能总计数百万次。
      # 这一步按目标逐个核对读数（含「账上出现的目标必须都在清单里」那条漏配判据），
      # 并顺手验「指定单目标时没串到别类」——独立预算真生效的证据
      - name: 核对分目标读数与产量
        run: python3 scripts/check-fuzz-report.py .fuzz/log

      # 语料留 14 天：撞出来的形状要能喂回本地继续挖，也能直接搬进 gtest 的种子用例
      - name: 保留语料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: .fuzz/corpus/
          retention-days: 14
          if-no-files-found: ignore

      - name: 失败时取出崩溃样本
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: .fuzz/artifacts/
          if-no-files-found: ignore

  # 覆盖率：先补上「CI 里根本没有数字」这件事——跑一遍全量用例收 .gcda，gcovr 出行/函数/分支三份读数，
  # 再由 scripts/check-coverage-gate.py 把关。四条下限（总行 / 总函数 / 总分枝 / 逐模块行）全部取在
  # 那个脚本里（默认值按 2026-10-01 实测往下留一档：总行 77.08 / 函数 85.44 / 分支 62.38；
  # Net 89.94、Platform 87.08、Core 84.98、Base 75.74、Database 50.50）——原先总行下限另放在这里的一个
  # env 里，「两处必须同解」只能靠口头守而值守不住；收进脚本后阈值只有一个落点。分模块这条是重点：
  # 本作业起 PG/Redis/MySQL 三件真机；Database 仍是全仓最低的一片，只看总数会隐身。阈值故意取在实测下游，要提先实测。
  coverage:
    name: 覆盖率门禁
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
      - uses: actions/checkout@v4

      # 这个键必须与 mysql-driver-compile 相同、与其它作业不同：本作业的依赖集里有
      # libmysqlclient，而 GitHub 的缓存一经写入不可覆盖——共用无 mysql 的键会永远命中
      # 一份缺它的缓存，每一轮都白付现场编译的钱。两个作业的依赖集与构建类型相同，命中就是白拿。
      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-mysql-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan 与 gcovr
        run: |
          python3 -m venv "$HOME/cov-venv"
          # gcovr 要钉版：这道门的判据是「TOTAL 行里有没有百分比」与 `--gcov-ignore-parse-errors`
          # 的取值集合，两者都随 gcovr 的格式与选项漂移。容器里按同一件 8.6 复核过。
          "$HOME/cov-venv/bin/pip" install "conan>=2.25" "gcovr==8.6"
          echo "$HOME/cov-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（--coverage 插桩；关掉 sanitizer——两种插桩互相干扰，且门禁另有作业）
        run: |
          cmake -S . -B build/coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=OFF \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DDATABASE_WITH_MYSQL=ON \
            -DASYN_BUILD_SAMPLES=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/conan_provider.cmake"
          # EXPORT_COMPILE_COMMANDS 是给下面那道加固核对用的：它判「编译命令行里有没有该带的开关」，
          # 判据来源就是这份编译数据库。2026-10-10 首跑时这里没开，脚本按设计退 2（前置缺件不当通过），
          # 红的正是接线本身——那条 fail-safe 第一次真跑就把自己钉在了一档没有数据库的构建上

      - name: 编译全部用例（-k 0 收集式失败，一次看全所有编译错误）
        run: cmake --build build/coverage -- -k 0

      - name: 起 PostgreSQL、Redis 与 MySQL 真机（真机用例的门从 SKIP 变真跑）
        # Database 格垫底的原因不是没测：PG/Redis/MySQL 三张驱动的真机用例在本作业里全是
        # GTEST_SKIP（没有可连的服务端），被跳过的每一行都不进覆盖。把三件服务当场喂给用例——
        # 数字往上走靠真跑的用例，不靠动下限。口令当场随机生成经 GITHUB_ENV 传给后续步骤，
        # 仓库零明文。端口避开 5432/6379/3306：runner 镜像里装着 PostgreSQL 与 MySQL（服务默认
        # 没起、端口空着），用非默认口只是防御性的。
        run: |
          postgres_password="$(openssl rand -hex 16)"
          redis_password="$(openssl rand -hex 16)"
          mysql_password="$(openssl rand -hex 16)"
          echo "ASYN_POSTGRES_TEST_PASSWORD=$postgres_password" >> "$GITHUB_ENV"
          echo "ASYN_POSTGRES_TEST_PORT=5433" >> "$GITHUB_ENV"
          echo "ASYN_REDIS_TEST_PASSWORD=$redis_password" >> "$GITHUB_ENV"
          echo "ASYN_REDIS_TEST_PORT=6380" >> "$GITHUB_ENV"
          echo "ASYN_MYSQL_TEST_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "ASYN_MYSQL_TEST_PORT=3307" >> "$GITHUB_ENV"
          echo "ASYN_MYSQL_TEST_USER=root" >> "$GITHUB_ENV"
          echo "ASYN_MYSQL_TEST_PASSWORD=$mysql_password" >> "$GITHUB_ENV"
          echo "ASYN_MYSQL_TEST_DATABASE=asyngyanis_test" >> "$GITHUB_ENV"
          docker run -d --name coverage-postgres -e POSTGRES_PASSWORD="$postgres_password" -p 5433:5432 postgres:16
          docker run -d --name coverage-redis -p 6380:6379 redis:7.4 redis-server --requirepass "$redis_password"
          # MYSQL_ROOT_HOST 必须给：用例从宿主的 127.0.0.1:3307 进来，源地址是 docker 网桥，
          # 默认只建 root@localhost 会被拒（现场症状是整组 60 条全红在「连不上」）
          docker run -d --name coverage-mysql \
            -e MYSQL_ROOT_PASSWORD="$mysql_password" \
            -e MYSQL_ROOT_HOST=% \
            -e MYSQL_DATABASE=asyngyanis_test \
            -p 3307:3306 mysql:8
          # 就绪判据用官方自带工具轮询，不睡固定时长：先定义「什么时候算好」，好了才放行；
          # 轮询耗尽后那三条不带循环的调用就是判据本身——没起来就红在轮到实例的这一步
          for attempt in $(seq 1 30); do
            docker exec coverage-postgres pg_isready -U postgres && break
            sleep 2
          done
          docker exec coverage-postgres pg_isready -U postgres
          for attempt in $(seq 1 30); do
            docker exec -e REDISCLI_AUTH="$redis_password" coverage-redis redis-cli ping && break
            sleep 1
          done
          docker exec -e REDISCLI_AUTH="$redis_password" coverage-redis redis-cli ping
          for attempt in $(seq 1 60); do
            docker exec -e MYSQL_PWD="$mysql_password" coverage-mysql mysqladmin ping -h 127.0.0.1 -u root && break
            sleep 2
          done
          docker exec -e MYSQL_PWD="$mysql_password" coverage-mysql mysqladmin ping -h 127.0.0.1 -u root

      - name: 跑用例生成 .gcda
        # --output-on-failure 是这一档的可读性命门：全仓其它用例步骤都带它，唯独这里没带，
        # 于是 2026-10-08 那次红只在收尾打了「The following tests FAILED: 3954 - …」一行，
        # 断言原文（哪一句、期望与实际各是多少）整条丢失，只能靠复现去猜是环境慢还是判据错
        run: ctest --test-dir build/coverage -j 4 --output-on-failure

      - name: 汇总覆盖率并按模块与总数把关
        run: |
          # gcovr 8.6 的两处坑：`--csv`/`--txt` 的取值是可选位置参数，写成 `--csv 路径` 会被后面的词吃掉
          # （实测报 OSError: Unknown directory 'n'），必须用 `--csv=路径`；`--branches`/`--txt-branches`
          # 已废弃，换成 `--txt-metric branch`。GCC 会把分支命中数报成负数（实测
          # Base/Log/LoggerRegistry.cpp:95 的 branch 2 taken -463），默认遇负即崩——崩掉就没有读数，
          # 比带着噪声出数更糟，故按 gcovr 自己提示的口径降级成每文件告警一次。
          gcovr --root "$PWD" --filter 'src/' --exclude-unreachable-branches --exclude-throw-branches \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --txt-metric branch --csv=/tmp/gcovr.csv --txt=/tmp/gcovr.txt | tee /tmp/gcovr-console.txt
          # 退出码要能穿过管道活下来：判据不押在 runner 给不给 pipefail/-e 上，显式取 PIPESTATUS[0]
          gcovr_rc=${PIPESTATUS[0]}
          if [ "$gcovr_rc" -ne 0 ]; then
            echo "gcovr 退出码 $gcovr_rc：这道门按没跑成处理，不当成「覆盖率没问题」"
            exit "$gcovr_rc"
          fi
          # 「跑过」的判据是真出一行带百分比的 TOTAL；位数不写死（8.6 打整数、旧版打小数，
          # 写死小数那一档时本作业把一份合格读数判成没跑成，红过一次）
          grep -qE "TOTAL.*[0-9]+%" /tmp/gcovr.txt || {
            echo "gcovr 没有交出汇总行（上面是它的诊断）"
            exit 1
          }
          echo "### 行覆盖率（本轮实测）" >> "$GITHUB_STEP_SUMMARY"
          grep -E "TOTAL.*[0-9]+%" /tmp/gcovr.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"
          # 阈值只在这一处判：gcovr 自己的 --fail-under-line 撤了，改由脚本把四条下限（总行 / 总函数 /
          # 总分枝 / 逐模块行）全部收在自己身上把关——总数 77% 达标时 Database 只有 50.5%，
          # 聚合数会替死角掩护（本轮实测 Net 89.94 / Platform 87.08 / Core 84.98 / Base 75.74 / Database 50.50）
          python3 scripts/check-coverage-gate.py --csv /tmp/gcovr.csv

      - name: 加固位核对（编译命令行与镜像头，取本档自己的 CMakeCache 为期望）
        run: |
          # 挂在这一档而不是另起一档：它是 Linux 侧唯一「非 sanitizer 且真的链接出产物」的构建，
          #  sanitizer 那几档按设计不叠加固位（一次 trap 归因不清），核不到正面的位。
          # 判据分两层：CMakeLists 说加了 ≠ 编译命令行里有；命令行里有 ≠ 镜像真的带上
          # RELRO / BIND_NOW / 不可执行栈。缺 readelf 或没有产物都退 2，不交一张空表被读成通过
          python3 scripts/check-hardening.py --build build/coverage

  # 示例矩阵：把 samples/ 下每个自检程序各跑一遍、按退出码判——它们是「库外消费者」形状的用例，
  # 公开契约好不好用、中间件挂法对不对，只有把这些当程序跑一遍才知道。此前 .github 里一条引用都没有，
  # 改坏一个示例不会有任何作业变红。用 Debug 档：它带 ASan + UBSan（Linux 上 ASan 默认开泄漏检测），
  # 示例自己漏的资源只有跟着这一档跑才看得见。假绿由 run_samples.py 自己兜：一个可执行体都没找到退 2；
  # ninja 清单里有这个示例、构建目录里却没有产物，也当场报「它这一次根本没跑」。
  samples:
    name: 示例矩阵：各模块自检程序（Linux）
    runs-on: ubuntu-latest
    # 这一条要全量构建（含测试与示例），冷缓存时按 coverage 那条同量级估；60 分钟留给冷启动太紧
    timeout-minutes: 90

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      # ccache 的 restore-keys 退到「本机任意一份」：本作业的源码与 build-and-test 完全同源，
      # 只有 ccache 参数前缀不同，冷启动时借那份缓存能省掉十几分钟
      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-samples-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-samples-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: 安装 Conan 与 ccache
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Debug + sanitizers + ccache）
        run: |
          cmake --preset debug -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: 构建（全部目标，含示例）
        run: cmake --build build/debug -- -k 0

      - name: 降低 ASLR 熵（稳定 AddressSanitizer）
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: 跑示例矩阵（MySQL/Redis 无凭据即按门控 SKIP）
        run: |
          # 退出码不押在 runner 给不给 pipefail 上：先收进变量，摘要打完了再照它退
          python3 scripts/run_samples.py --build build/debug --timeout 400 > /tmp/samples.log 2>&1 && rc=0 || rc=$?
          # 失败详情（哪一步没过＋那条示例自己的末尾输出）在表格之前进 stderr，表格只有十来行：
          # 只 tail 末尾就把这块整片丢掉，红的时候只剩一句结论，Linux 档与 Windows 档同一形状
          grep -A 10 "^  !!" /tmp/samples.log || true
          tail -24 /tmp/samples.log
          {
            echo "### 示例矩阵（Linux）"
            echo '```'
            tail -20 /tmp/samples.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # ACME 的跨实现验收：进程内那台桩机构与本仓同源、跟着一起被改，真机构那条用例又只走到「取目录 + 建号」。
  # Pebble 是 Let's Encrypt 官方那套 ACME 测试服务端（Go 写的独立实现），它把 HTTP-01 的取令牌端口配成
  # 回环可达，于是 CI 里就能走完整台 RFC 8555 状态机并把签出的链验到对面本次生成的根。
  # 这一步抓到过两个「桩不会拒」的线上不兼容：请求漏 User-Agent（Boulder/Pebble 一律 400 malformed）、
  # 机构复用已 valid 的授权时客户端又去触发那条挑战。此前它只在本地与容器跑，.github 零引用。
  acme-pebble:
    name: ACME 真机构验收：Pebble
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-acme-pebble-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-acme-pebble-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: 安装 Conan 与 ccache
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Debug + sanitizers + ccache）
        run: |
          cmake --preset debug -DDATABASE_WITH_MYSQL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # 只编签发探针这一个目标：它把整台状态机跑通，不需要测试二进制——省掉十几分钟
      - name: 构建签发探针
        run: cmake --build build/debug --target acme_issuance_probe

      - name: 取出 Pebble（镜像里的 app 与 test/）
        run: |
          # 裁判钉定到内容摘要：:latest 会随时间换内容，同一提交两个日子跑出两种判决，就说不清
          # 「这份报告到底谁判的」。@sha256 取自本机现存副本（镜像自报 revision b1e1ca4f）；
          # 升级 = 换摘要，并复核下面两条 docker cp 的路径没变
          image="ghcr.io/letsencrypt/pebble:latest@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199"
          docker pull "$image"
          cid="$(docker create "$image")"
          mkdir -p /tmp/pebble-lab
          docker cp "$cid:/app" /tmp/pebble-lab/app
          docker cp "$cid:/test" /tmp/pebble-lab/test
          docker rm "$cid" >/dev/null
          chmod +x /tmp/pebble-lab/app
          ls -l /tmp/pebble-lab/app /tmp/pebble-lab/test/config/pebble-config.json

      - name: ACME 跨实现验收（状态机、续期、链与 SAN；场景数由脚本现数）
        run: |
          # 脚本的退出码分三档：0 全过、1 某场景没过（这才是被测面的问题）、2 前置缺件（拿不到裁判：
          # 镜像没拉到、探针没编出来、 openssl 缺、端口被占、通配解析没通）。2 也判红，但消息要说清是哪
          # 一档——「裁判没起来」不能读成「ACME 没问题」；具体缺哪件由脚本自己打在那一行
          bash scripts/acme_pebble_cross_check.sh build/debug /tmp/pebble-lab > /tmp/acme-pebble.log 2>&1 && rc=0 || rc=$?
          tail -20 /tmp/acme-pebble.log
          case "$rc" in
            0) echo "Pebble 验收全过" ;;
            1) echo "有场景没过：看上面的场景编号，那是被测面的问题" ;;
            *) echo "前置缺件（rc=$rc）：缺哪件见上面最后一条 [acme-cross]，属「拿不到裁判」，重跑这条作业即可复核" ;;
          esac
          {
            echo "### ACME 真机构验收（Pebble）"
            echo '```'
            tail -12 /tmp/acme-pebble.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
  # 交付物：装出去的三种形态（CMake 安装包、Conan 包、镜像）在这一格出现之前，CI 里对它们的
  # 验证次数是 0——`cmake --install`、`conan create`、`docker build` 在 .github/workflows 全 0 命中，
  # 于是第 4 轮那三处「会让部署白配或连不上」的样例缺陷能整轮上船。这一条把它们钉成门禁：
  # 装出来的东西要能被外部工程 find_package + 真链接 + 跑起来，Conan 包要连它自带的 test_package
  # 一起过，镜像要挂着仓库里那份配置样例起得来、答得出来、日志真的落盘。全程不需要任何真机服务与凭据。
  delivery:
    name: 交付物：安装、消费方与镜像
    runs-on: ubuntu-latest
    # 本作业要跑两次 Release 全树构建（一次在 runner 上、一次在镜像里）再加 conan create；
    # 缓存冷时按 coverage 那条的量级估，上限给到 90 分钟，判据仍看每步的实测读数
    timeout-minutes: 90

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      # ubuntu-latest 的 pip 受 PEP 668 限制不能直接装包，先建虚拟环境再进 PATH
      - name: 安装 Conan
        run: |
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install "conan>=2.25"
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置与构建（Release，只建要装出去的五个模块）
        run: |
          cmake --preset release -DASYN_BUILD_TESTS=OFF -DDATABASE_WITH_MYSQL=OFF
          cmake --build build/release --target Platform Base Core Net Database -- -k 0

      - name: 安装到全新前缀
        run: |
          # 前缀必须先清干净：旧构建目录里残留的 cmake_install.cmake 会让「装到临时前缀」假绿
          # （本地踩过，CI 每次都是全新 checkout，这里照样显式 rm，别把判据押在工作目录是新的上面）
          rm -rf /tmp/asyn-prefix
          cmake --install build/release --prefix /tmp/asyn-prefix
          installed=$(find /tmp/asyn-prefix -type f | wc -l)
          echo "装出文件数=$installed"
          # 「装出来 0 个文件」也能让下一步的 find_package 报一句看不懂的话，先在这里拦下并给数
          test "$installed" -gt 100 || { echo "装出来的东西少得可疑（<=100）：导出规则大概没跑全"; exit 1; }
          {
            echo "### 交付物：安装"
            echo "装出 $installed 个文件（含 AsynGyanisConfig.cmake 与导出目标）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 消费方：find_package 装出来的包并真引用一个符号
        run: |
          # 只 include 头不会让链接器去解析依赖：取一次成员函数地址留在 volatile 变量里，
          # 「地址必非空」的折叠被 volatile 挡住，包少链一个模块或漏声明一条外部依赖时
          # 红的是这一步，而不是「编译过了」——现成写法见 packaging/conan/test_package/main.cpp
          mkdir -p /tmp/asyn-consumer
          cat > /tmp/asyn-consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(AsynDeliveryConsumer CXX)

          find_package(AsynGyanis REQUIRED COMPONENTS Net)

          add_executable(asyn-consumer main.cpp)
          target_link_libraries(asyn-consumer PRIVATE AsynGyanis::Net)
          EOF
          cat > /tmp/asyn-consumer/main.cpp <<'EOF'
          #include "Net/Http/HttpServer.h"

          #include <cstdio>

          int main()
          {
              volatile auto entry = &AsynGyanis::Net::HttpServer::router;
              static_cast<void>(entry);
              std::printf("consumer_probe: 装出来的包能链、能跑\\n");
              return 0;
          }
          EOF
          # 库的依赖（OpenSSL/zlib/zstd/brotli/yaml-cpp）由本次构建的 Conan 生成器供给：把那份
          # 工具链指给消费方，find_dependency 才能落到同一批包上。找不到就说明依赖没被装出来，
          # 那一趟「消费方通过了」没有可比性，宁可红在这里
          toolchain=$(find "$GITHUB_WORKSPACE/build/release" -name conan_toolchain.cmake | head -1)
          test -n "$toolchain" || { echo "找不到 Conan 生成的工具链，消费方没有可比的前置依赖"; exit 1; }
          cmake -S /tmp/asyn-consumer -B /tmp/asyn-consumer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/asyn-prefix \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain"
          cmake --build /tmp/asyn-consumer/build
          /tmp/asyn-consumer/build/asyn-consumer

      - name: Conan 包：conan create 连自带 test_package 的冒烟一起跑
        run: |
          # 这条与上面那条是两条独立通路：Conan 配方自己声明 cpp_info（含 /utf-8 与逐个外部依赖），
          # 装出来的包漏一项就在 test_package 里链接期报错——那是「别人吃这份包」时的形状
          conan create packaging/conan --build=missing

      - name: 镜像：构建、挂载仓库里的配置样例并断言真的在应答
        run: |
          docker build -f packaging/Dockerfile -t asyngyanis:ci .
          image_size=$(docker images asyngyanis:ci --format '{{.Size}}')
          echo "镜像大小=$image_size"
          # 样例要复制成 .yaml 再挂：ConfigManager 按扩展名认文件，直接挂 *.example 会报「读取配置文件失败」
          mkdir -p /tmp/asyn-ci-cfg
          cp packaging/asyngyanis.yaml.example /tmp/asyn-ci-cfg/asyngyanis.yaml
          # --host 0.0.0.0 必须显式给：`docker run 镜像 --config …` 会整段替换 CMD，连带丢掉镜像里那条
          # --host，服务于是只听回环——端口映射看着通，症状只有超时（这一格是第 4 轮实跑抓出来的）
          docker run -d --name asyn-ci \
            -v /tmp/asyn-ci-cfg:/cfg:ro \
            -p 18099:8080 \
            asyngyanis:ci --host 0.0.0.0 --port 8080 --config /cfg/asyngyanis.yaml
          # 等健康检查落定（镜像 HEALTHCHECK 用 bash 的 /dev/tcp 探端口，默认 30 秒一节拍），最多 90 秒
          healthy=none
          for _ in $(seq 1 18); do
            healthy=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' asyn-ci)
            if [ "$healthy" = "healthy" ]; then break; fi
            sleep 5
          done
          echo "健康状态=$healthy"
          test "$healthy" = "healthy" || { docker logs asyn-ci; exit 1; }
          business_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/ || true)
          echo "业务口 / =$business_code"
          # 管理口只听回环（metrics_address 默认 127.0.0.1，这是刻意的来源收口），端口映射吃不到它，
          # 只能从容器内部探。镜像里刻意不装 curl，所以用 HEALTHCHECK 同一件工具：bash 的 /dev/tcp
          healthz_line=$(docker exec asyn-ci bash -c 'exec 3<>/dev/tcp/127.0.0.1/9091 || exit 0; printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; head -n 1 <&3' || true)
          echo "管理口 /healthz =$healthz_line"
          test "$business_code" = "200" || { docker logs asyn-ci; exit 1; }
          case "$healthz_line" in
            "HTTP/1.1 200"*) ;;
            *) docker logs asyn-ci; exit 1 ;;
          esac
          # 配置样例被读出来时不该留一行 LoggerConfig 诊断：那一句是「配了却不生效」唯一的出声处，
          # 上一轮那处 loggers 写成列表的缺陷就是靠它现形的（grep 零命中时退 1，计数一律先收进变量）
          diagnostics=$(docker logs asyn-ci 2>&1 | grep -c "LoggerConfig：" || true)
          echo "LoggerConfig 诊断行数=$diagnostics"
          test "$diagnostics" = "0" || { docker logs asyn-ci; exit 1; }
          # 运行期落盘：不发 SIGHUP、不做任何收口动作，文件就得已经有字节——文件 sink 不 flush 时
          # tail -f、Filebeat/vector 与崩溃后的取证什么都读不到
          log_bytes=$(docker exec asyn-ci sh -c 'wc -c < /var/lib/asyngyanis/logs/asyngyanis.log' || true)
          echo "日志文件字节数=${log_bytes:-0}"
          test "${log_bytes:-0}" -gt 0 || { docker logs asyn-ci; exit 1; }
          # 访问日志真进了那份文件（装机形态一条都不产是第 4 轮的同一族缺口）
          access_lines=$(docker exec asyn-ci sh -c 'grep -c "HTTP 访问" /var/lib/asyngyanis/logs/asyngyanis.log' || true)
          echo "访问日志行数=${access_lines:-0}"
          test "${access_lines:-0}" -ge 1 || { docker exec asyn-ci sh -c 'tail -20 /var/lib/asyngyanis/logs/asyngyanis.log'; exit 1; }
          {
            echo "### 交付物：Conan 包与镜像"
            echo "镜像 $image_size；健康状态 $healthy；业务口 / $business_code；管理口 /healthz 首行「$healthz_line」；"
            echo "日志文件 ${log_bytes:-0} 字节、其中访问日志 ${access_lines:-0} 行；LoggerConfig 诊断 $diagnostics 行"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 校验 systemd 单元样例
        run: |
          # 两份样例都是交付件（抄到 /etc/systemd/system 就是真跑的那份），所以要让 systemd 的解析器
          # 读一遍。.socket 没有 ExecStart，期望是零报告——多一条就是红；.service 在这台机器上没有
          # /usr/local/bin/ReferenceServer（安装步用的是别的前缀），期望只剩「命令不可执行」那两条。
          # 判据写成「把已知那条滤掉之后必须为空」，而不是「grep 到已知那条就算过」——后者在
          # 解析器一条都不报时也会绿。
          set -u
          unit_dir=$(mktemp -d)
          cp packaging/asyngyanis.service.example "$unit_dir/asyngyanis.service"
          cp packaging/asyngyanis.socket.example "$unit_dir/asyngyanis.socket"
          # docker cp 之外这里也是复制出来的文件，权限按 644 钉一遍：systemd 会抱怨 world-writable
          chmod 644 "$unit_dir/asyngyanis.service" "$unit_dir/asyngyanis.socket"
          cd "$unit_dir"

          socket_report=$(systemd-analyze verify asyngyanis.socket 2>&1)
          echo "socket 单元报告：${socket_report:-（空）}"
          test -z "$socket_report" || { echo "socket 单元有告警或错误"; exit 1; }

          service_report=$(systemd-analyze verify asyngyanis.service 2>&1 || true)
          unexpected=$(echo "$service_report" | grep -av "Command /usr/local/bin/ReferenceServer is not executable" | sed '/^$/d')
          echo "service 单元非预期报告：${unexpected:-（空）}"
          test -z "$unexpected" || { echo "service 单元有除「本机没有那个二进制」之外的报告"; exit 1; }

          {
            echo "### systemd 单元样例"
            echo "两份样例 verify 通过：.socket 零报告；.service 只剩「/usr/local/bin/ReferenceServer 不在本机」这一族预期抱怨"
          } >> "$GITHUB_STEP_SUMMARY"
