name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ============================================================================
  # Linux 构建 + 打包
  # ============================================================================
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build python3-venv python3-pip

      - name: Setup Conan
        run: |
          python3 -m venv .venv
          .venv/bin/pip install conan
          .venv/bin/conan profile detect --force
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-release-${{ hashFiles('conandata.yml') }}
          restore-keys: conan-release-

      - name: Configure (release)
        run: cmake --preset release

      - name: Build
        run: cmake --build build/release -j$(nproc)

      - name: Test
        working-directory: build/release
        run: ctest --output-on-failure -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist/include dist/lib
          cp -r src/Base src/Core src/Net src/Platform dist/include/
          cp build/release/src/Base/libBase.a dist/lib/
          cp build/release/src/Core/libCore.a dist/lib/
          cp build/release/src/Net/libNet.a dist/lib/
          cp build/release/samples/echo_server dist/
          tar -czf asyngyanis-${{ github.ref_name }}-linux-x86_64.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asyngyanis-${{ github.ref_name }}-linux-x86_64
          path: asyngyanis-${{ github.ref_name }}-linux-x86_64.tar.gz

  # ============================================================================
  # Windows 构建 + 打包
  # ============================================================================
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Conan
        run: |
          python -m pip install conan
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-windows-release-${{ hashFiles('conandata.yml') }}
          restore-keys: conan-windows-release-

      - name: Configure (windows-release)
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build build/win-release --config Release

      - name: Test
        working-directory: build/win-release
        run: ctest --output-on-failure -C Release

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist/include, dist/lib | Out-Null
          Copy-Item -Recurse src/Base, src/Core, src/Net, src/Platform dist/include/
          Copy-Item build/win-release/src/Base/Release/Base.lib dist/lib/
          Copy-Item build/win-release/src/Core/Release/Core.lib dist/lib/
          Copy-Item build/win-release/src/Net/Release/Net.lib dist/lib/
          Copy-Item build/win-release/samples/Release/echo_server.exe dist/
          Compress-Archive -Path dist -DestinationPath asyngyanis-${{ github.ref_name }}-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asyngyanis-${{ github.ref_name }}-windows-x86_64
          path: asyngyanis-${{ github.ref_name }}-windows-x86_64.zip

  # ============================================================================
  # 创建 GitHub Release（合并 Linux + Windows 产物）
  # ============================================================================
  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: asyngyanis-*
          merge-multiple: true
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## AsynGyanis ${{ github.ref_name }}

            ### 编译依赖
            - GCC 13+ / Clang 17+ (Linux) 或 MSVC 2022+ (Windows)
            - CMake >= 3.20
            - Conan >= 2.0
            - Ninja（推荐）

            ### 安装

            #### Linux
            ```bash
            tar -xzf asyngyanis-${{ github.ref_name }}-linux-x86_64.tar.gz
            cd dist && cmake --install .
            ```

            #### Windows
            ```powershell
            Expand-Archive asyngyanis-${{ github.ref_name }}-windows-x86_64.zip
            cd dist && cmake --install .
            ```

            ### 变更
            详见 [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
