# Windows CI：构建（Debug + AddressSanitizer）并跑全量用例。
#
# 与 linux-ci.yml 分工：本工作流覆盖 MSVC + winsock 路径；GCC/Linux 侧由 linux-ci.yml
# 覆盖（GCC 的 ASan 额外检出 use-after-scope 与泄漏，MSVC 的 ASan 不支持这两类检测）。
#
# 编译输出由 sccache 缓存（MSVC 侧的时间几乎全花在编译上，用例本身只占一小部分）。
# 为了让 MSVC 的调试信息可缓存，CI 里把调试信息格式换成 Embedded（/Z7）：默认的 /Zi 会把
# 调试信息写进一个共享 PDB，并行编译时多个 cl.exe 抢同一个 PDB 直接报 C1041，sccache 也不缓存。
# 这个变量受策略 CMP0141 管辖，而本工程的 cmake_minimum_required 是 3.20（策略默认 OLD，
# 于是变量会被静默忽略）——因此配置行里还要把 CMP0141 显式置 NEW。只影响 CI 的构建目录。

name: Windows 门禁

on:
  # 只在 main 的推送与手动触发上跑：日常开发在 develop 上，PR 不再触发任何 CI（免费分钟数有限，
  # 一次全量构建+用例要几十个 runner 分钟）。要验证某个提交就手动 dispatch，或者合进 main。
  push:
    branches: [ main ]
    # 纯文档改动与工作流自身的改动不值得等构建；版本号门禁在 release-gate.yml，那条不受这里影响
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: 构建与全量用例（MSVC + ASan）
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      # Conan 的包缓存搬到仓库内，便于下面的 actions/cache 缓存它
      CONAN_HOME: ${{ github.workspace }}/.conan2
      # libmysqlclient 在 ConanCenter 上只有源码包，现场编译要十几分钟；CI 不需要真机
      # MySQL（驱动有报错桩，集成用例本身也按环境变量跳过），因此跳过该依赖
      ASYN_SKIP_MYSQL_DEPS: "1"
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 缓存 sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py', 'CMakeLists.txt') }}-
            sccache-${{ runner.os }}-

      # 让 cl.exe、ninja 等进入 PATH；windows-latest 上已预装 Visual Studio 与 Ninja
      - uses: ilammy/msvc-dev-cmd@v1

      - name: 安装 Conan 与 sccache
        run: |
          pip install "conan>=2.25"
          choco install sccache -y --no-progress

      - name: 探测 Conan profile
        run: conan profile detect --force

      - name: 配置（Debug + sanitizers + sccache；Conan 依赖由 conan_provider.cmake 自动安装）
        run: cmake --preset debug -DDATABASE_WITH_MYSQL=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_POLICY_DEFAULT_CMP0141=NEW

      # 零告警是本仓库的提交硬判据：构建失败与告警都会让这一步红
      - name: 构建
        run: cmake --build build/debug

      # 缓存是否真的命中，看这一行的 compile requests / cache hits
      - name: sccache 统计
        run: sccache --show-stats

      - name: 全量用例
        run: ctest --test-dir build/debug --output-on-failure --parallel

      # 示例目标在这条作业里本来就编（--build 全目标），跑一遍只要几十秒，
      # 而它是「库外消费者形状」在 Windows 上的唯一覆盖
      - name: 示例矩阵（各模块自检程序）
        shell: bash
        run: |
          python scripts/run_samples.py --build build/debug --timeout 600 > "$RUNNER_TEMP/samples.log" 2>&1 && rc=0 || rc=$?
          tail -24 "$RUNNER_TEMP/samples.log"
          {
            echo "### 示例矩阵（Windows）"
            echo '```'
            tail -20 "$RUNNER_TEMP/samples.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: 失败时上传用例日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: build/debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # Windows 侧此前只有「用例」这一层：格式与静态检查在 Windows 档完全没有，改坏了要等 Linux 那条作业
  # 才报。这一条把两道补上，用的是与 Linux 同一件 clang-format（钉版 23.1.1）与同一份 .clang-tidy。
  static-analysis:
    name: Windows 静态档：格式与 clang-tidy
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      ASYN_SKIP_MYSQL_DEPS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 装与 Linux 同版的 clang-format
        shell: bash
        run: python -m pip install "clang-format==23.1.1"

      - name: 全仓格式检查（先自证清单非空；有差异即失败）
        shell: bash
        run: |
          # 与 Linux 那一步同一个判据：`xargs -0` 拿到空清单会用零参数调用 clang-format，
          # 它读空 stdin 退出 0——glob 失配会把这道门变成「什么都没查还报绿」
          fileCount="$(git ls-files '*.h' '*.hpp' '*.cpp' '*.cc' | wc -l)"
          echo "参与格式检查的跟踪源文件：${fileCount} 个"
          if [ "${fileCount}" -lt 500 ]; then
            echo "清单只有 ${fileCount} 条，不像全仓——按「没跑成」处理"
            exit 1
          fi
          git ls-files -z '*.h' '*.hpp' '*.cpp' '*.cc' \
            | xargs -0 clang-format --style=file --dry-run -Werror

      - name: 缓存 Conan 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan
        run: python -m pip install "conan>=2.25"

      - name: 探测 Conan profile
        shell: bash
        run: conan profile detect --force

      # 编译数据库取 Release 档：Debug 那一份带 /MDd 与 -fsanitize=address，clang 不接受这两个同时给
      # （实测报 invalid argument '-MDd' not allowed with '-fsanitize=address'），而命名类检查与优化档无关
      - name: 配置（Release，只为出编译数据库）
        run: cmake --preset release -DDATABASE_WITH_MYSQL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy（报告形式，当前不阻塞）
        shell: bash
        run: |
          clangTidy="$(command -v clang-tidy || echo '/c/Program Files/LLVM/bin/clang-tidy.exe')"
          if [ ! -x "$clangTidy" ]; then
            echo "runner 上没有 clang-tidy：这道门按没跑成处理，不当成通过"
            exit 1
          fi
          "$clangTidy" --version | head -2
          # 逐翻译单元跑、每个留一条标记，而不是 xargs -n 8 批量跑完只看报告有没有行：批量那版里
          # 「一条诊断都没有」「一个都没跑成」「xargs 被信号打断只剩半截」三种情形在报告里长得一模一样，
          # 前一种还会被读成通过。标记数必须等于翻译单元数，非零退出必须是 0——这两条才是「真跑过」。
          tidyDir="$RUNNER_TEMP/tidy"
          rm -rf "$tidyDir"
          mkdir -p "$tidyDir"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'file="$1"' \
            'slug=${file//[!A-Za-z0-9]/_}' \
            '"$TIDY_BIN" -p build/release --quiet "$file" > "$TIDY_DIR/${slug}.log" 2>&1 && rc=0 || rc=$?' \
            'printf "TIDY-PROCESSED %s rc=%s\n" "$file" "$rc" > "$TIDY_DIR/${slug}.mark"' \
            'exit 0' > "$RUNNER_TEMP/tidy-one.sh"
          export TIDY_BIN="$clangTidy" TIDY_DIR="$tidyDir"
          find src -name '*.cpp' | tr '\n' '\0' | xargs -0 -n 1 -P 4 bash "$RUNNER_TEMP/tidy-one.sh"
          cat "$tidyDir"/*.log > "$RUNNER_TEMP/clang-tidy.log" 2>/dev/null || true
          tuCount=$(find src -name '*.cpp' | wc -l)
          markCount=$(ls "$tidyDir"/*.mark 2>/dev/null | wc -l)
          failedCount=$(grep -l " rc=[1-9]" "$tidyDir"/*.mark 2>/dev/null | wc -l)
          warningCount=$(grep -cE "warning:|error:" "$RUNNER_TEMP/clang-tidy.log" 2>/dev/null || true)
          echo "翻译单元 ${tuCount} 个，实际处理 ${markCount} 个，非零退出 ${failedCount} 个，诊断 ${warningCount} 行"
          if [ "${markCount}" -lt "${tuCount}" ]; then
            echo "少了 $((tuCount - markCount)) 条处理标记：xargs 被打断或工具崩了，这道门按没跑成处理"
            exit 1
          fi
          if [ "${failedCount}" -gt 0 ]; then
            echo "${failedCount} 个翻译单元里 clang-tidy 非零退出（多半是编译数据库没命中或头文件解析不了）：这不等于「检查通过」"
            exit 1
          fi
          {
            echo "## clang-tidy 摘要（Windows，逐翻译单元自证；发现项当前不阻塞）"
            echo "- 翻译单元 ${tuCount} 个全部处理完，非零退出 ${failedCount} 个"
            echo "- 诊断行数（warning/error）：${warningCount}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 clang-tidy 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report-windows
          path: ${{ runner.temp }}/clang-tidy.log
          if-no-files-found: warn
