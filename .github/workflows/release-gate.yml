# 发布门禁：版本号三处（CMake 的 project(VERSION) / CHANGELOG 最新发布段 / 最新标签）必须一致。
#
# 单独成一条工作流的原因：它必须任何改动都跑——linux-ci 会跳过纯文档改动与工作流自身的改动
# （windows-ci 只跳过 `**.md` 与 `LICENSE`，它的注释明写不忽略 `.github/workflows/**`），而改 CHANGELOG 与版本号恰恰就是文档改动的
# 常态，正是这条门禁最该盯住的场景。几十秒的成本，不该被路径过滤一起跳掉。
#
# 本工作流只在 main 推送与手动触发上跑：develop 上的日常开发与 PR 都不触发，不消耗分钟数。

name: 发布门禁

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  version-consistency:
    name: 版本与交付物一致性
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # 只跑一条脚本，不装任何依赖：版本漂移要在几秒钟内暴露，而不是等几分钟的构建
      - name: 校验发布版本号（CMake / CHANGELOG / 标签）
        run: |
          # 标签取不到就要红：脚本对「一个标签都没有」按首个版本发布前的正常态放行，而浅克隆
          # 恰好也长成那个样子——把 fetch 失败吞掉（曾经的 `|| true`）就等于把「取不到裁判」
          # 读成「三处一致」。fetch 失败让这一步本身失败，别让它降级成一次静默跳过
          git fetch --tags --force --quiet
          python3 scripts/check-release-version.py

      # 公开接口面的 diff：安装出去的每一份公开头里的声明都要在基线登记过。
      # 同样不建不链——「发布之后才发现这次把 API 改破了」是最贵的一类事故，而它的判据只读源码
      - name: 校验公开接口面基线（声明级 diff，与 MAJOR 联动）
        run: python3 scripts/check-api-baseline.py
